<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">TruthLens AI system overview</title>
  <desc id="desc">A clean diagram showing TruthLens AI receiving article text, article URLs, or claims and routing them through article analysis, secure extraction, evidence verification, and live news components before producing traceable results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#0f172a}
      .sub{font:400 20px Arial,sans-serif;fill:#475569}
      .head{font:700 21px Arial,sans-serif;fill:#0f172a}
      .body{font:400 16px Arial,sans-serif;fill:#475569}
      .small{font:600 14px Arial,sans-serif;fill:#64748b}
      .chip{font:700 14px Arial,sans-serif;fill:#0f172a}
    </style>
  </defs>

  <rect width="1600" height="820" rx="28" fill="url(#bg)"/>
  <rect x="44" y="42" width="1512" height="736" rx="26" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="86" y="108" class="title">TruthLens AI</text>
  <text x="86" y="144" class="sub">B.Tech AI &amp; ML project • Article analysis • Claim verification • Evidence-aware results</text>

  <rect x="86" y="184" width="1428" height="88" rx="18" fill="url(#navy)"/>
  <text x="116" y="224" style="font:700 18px Arial,sans-serif;fill:#fff">INPUT</text>
  <text x="116" y="252" style="font:400 16px Arial,sans-serif;fill:#cbd5e1">Article text • Article URL • Live news • Standalone claim</text>

  <line x1="800" y1="272" x2="800" y2="306" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="86" y="324" width="330" height="188" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <rect x="442" y="324" width="330" height="188" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <rect x="798" y="324" width="330" height="188" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <rect x="1154" y="324" width="360" height="188" rx="18" fill="#fff" stroke="#cbd5e1"/>
  </g>

  <text x="114" y="364" class="head">Article model</text>
  <text x="114" y="394" class="body">ISOT-trained calibrated</text>
  <text x="114" y="418" class="body">Linear SVM for article text.</text>
  <rect x="114" y="446" width="120" height="34" rx="17" fill="#eff6ff"/>
  <text x="134" y="469" class="chip">99.59% test</text>
  <text x="114" y="498" class="small">Held-out ISOT benchmark • n=7,732</text>

  <text x="470" y="364" class="head">Secure URL extraction</text>
  <text x="470" y="394" class="body">SSRF-safe fetch + redirects</text>
  <text x="470" y="418" class="body">+ article body / metadata extraction.</text>
  <rect x="470" y="446" width="138" height="34" rx="17" fill="#f0fdf4"/>
  <text x="490" y="469" class="chip">Security-first</text>
  <text x="470" y="498" class="small">Private-IP, protocol and payload guards</text>

  <text x="826" y="364" class="head">Claim &amp; evidence layer</text>
  <text x="826" y="394" class="body">LIAR claim model + evidence</text>
  <text x="826" y="418" class="body">retrieval, provenance and abstention.</text>
  <rect x="826" y="446" width="180" height="34" rx="17" fill="#fff7ed"/>
  <text x="846" y="469" class="chip">No forced verdict</text>
  <text x="826" y="498" class="small">Supports insufficient-evidence states</text>

  <text x="1182" y="364" class="head">Live news pipeline</text>
  <text x="1182" y="394" class="body">RSS / Atom acquisition, deduplication</text>
  <text x="1182" y="418" class="body">and explicit content-source labels.</text>
  <rect x="1182" y="446" width="182" height="34" rx="17" fill="#fef2f2"/>
  <text x="1202" y="469" class="chip">Traceable sources</text>
  <text x="1182" y="498" class="small">Headline-only content is not treated as full text</text>

  <line x1="800" y1="512" x2="800" y2="548" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="86" y="570" width="1428" height="146" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="116" y="614" class="head">RESULT</text>
  <text x="116" y="646" class="body">Verdict / abstention • confidence where applicable • extracted metadata • evidence status • source URL / provenance</text>
  <text x="116" y="681" class="body">The system can return states such as SUPPORTED, CONTRADICTED, MIXED, INSUFFICIENT_EVIDENCE and NEEDS_MORE_CONTEXT.</text>
  <rect x="1215" y="610" width="248" height="58" rx="14" fill="#0f172a"/>
  <text x="1241" y="646" style="font:700 18px Arial,sans-serif;fill:#fff">Evidence before certainty</text>
</svg>