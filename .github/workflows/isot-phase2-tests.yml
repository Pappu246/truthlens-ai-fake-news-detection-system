name: Phase 2 ISOT Pipeline Tests

on:
  push:
    branches:
      - ml-upgrade-phase2
  pull_request:
    branches:
      - main

concurrency:
  group: truthlens-isot-legacy-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  isot-pipeline-tests:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'research/truthlens-v3-phase2-benchmark-harness' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip datasketch

      - name: Run Phase 2 synthetic tests
        run: python backend/tests/test_isot_pipeline.py
