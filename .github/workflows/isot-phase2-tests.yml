name: Phase 2 ISOT Pipeline Tests

on:
  push:
    branches:
      - ml-upgrade-phase2
  pull_request:
    branches:
      - main

jobs:
  isot-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip datasketch

      - name: Run Phase 2 synthetic tests
        run: python backend/tests/test_isot_pipeline.py
