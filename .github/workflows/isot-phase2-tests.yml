name: Phase 2 ISOT Pipeline Tests

permissions:
  contents: read

on:
  push:
    branches:
      - ml-upgrade-phase2
  pull_request:
    branches:
      - main
    paths:
      - 'backend/tests/test_isot_pipeline.py'
      - 'scripts/isot_*.py'
      - 'data/Fake.csv'
      - 'data/True.csv'
      - '.github/workflows/isot-phase2-tests.yml'

jobs:
  isot-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip datasketch

      - name: Run Phase 2 synthetic tests
        run: python backend/tests/test_isot_pipeline.py
