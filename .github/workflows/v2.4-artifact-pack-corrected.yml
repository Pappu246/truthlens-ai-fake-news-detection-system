name: V2.4 Exact Artifact Pack Corrected

on:
  push:
    branches:
      - assistant/v2.4-artifacts-20260927c

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen external artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact-bundle
          mkdir -p artifact-bundle/scifact
          mkdir -p artifact-bundle/models/v2/Xenova/all-MiniLM-L6-v2/onnx
          mkdir -p artifact-bundle/models/v2/Xenova/nli-deberta-v3-xsmall/onnx

          curl --fail --retry 4 --retry-all-errors -L "https://raw.githubusercontent.com/vidi-deshp12/scifact-claim-verification/051b5245aa9d4b98c1302920cc5e4958b9e30ef9/data/claims_dev.jsonl" -o artifact-bundle/scifact/claims_dev.jsonl
          curl --fail --retry 4 --retry-all-errors -L "https://raw.githubusercontent.com/vidi-deshp12/scifact-claim-verification/051b5245aa9d4b98c1302920cc5e4958b9e30ef9/data/corpus.jsonl" -o artifact-bundle/scifact/corpus.jsonl

          MINI="https://raw.githubusercontent.com/Sagesheep/NarrativeEngine-P/463cdd7853954fb904e8bddf863001ae61726796/mobile/public/models/Xenova/all-MiniLM-L6-v2"
          curl --fail --retry 4 --retry-all-errors -L "$MINI/onnx/model_quantized.onnx" -o artifact-bundle/models/v2/Xenova/all-MiniLM-L6-v2/onnx/model_quantized.onnx
          curl --fail --retry 4 --retry-all-errors -L "$MINI/tokenizer.json" -o artifact-bundle/models/v2/Xenova/all-MiniLM-L6-v2/tokenizer.json
          curl --fail --retry 4 --retry-all-errors -L "$MINI/tokenizer_config.json" -o artifact-bundle/models/v2/Xenova/all-MiniLM-L6-v2/tokenizer_config.json
          curl --fail --retry 4 --retry-all-errors -L "$MINI/config.json" -o artifact-bundle/models/v2/Xenova/all-MiniLM-L6-v2/config.json
          curl --fail --retry 4 --retry-all-errors -L "$MINI/vocab.txt" -o artifact-bundle/models/v2/Xenova/all-MiniLM-L6-v2/vocab.txt
          curl --fail --retry 4 --retry-all-errors -L "$MINI/special_tokens_map.json" -o artifact-bundle/models/v2/Xenova/all-MiniLM-L6-v2/special_tokens_map.json

          NLI="https://raw.githubusercontent.com/ElicoftZ/CotoLyrics-alpha/487f0c6d1b2ec41ef8e7c1c2266515a2caeb9738/models/Xenova/nli-deberta-v3-xsmall"
          curl --fail --retry 4 --retry-all-errors -L "$NLI/onnx/model_quantized.onnx" -o artifact-bundle/models/v2/Xenova/nli-deberta-v3-xsmall/onnx/model_quantized.onnx
          curl --fail --retry 4 --retry-all-errors -L "$NLI/tokenizer.json" -o artifact-bundle/models/v2/Xenova/nli-deberta-v3-xsmall/tokenizer.json
          curl --fail --retry 4 --retry-all-errors -L "$NLI/tokenizer_config.json" -o artifact-bundle/models/v2/Xenova/nli-deberta-v3-xsmall/tokenizer_config.json
          curl --fail --retry 4 --retry-all-errors -L "$NLI/config.json" -o artifact-bundle/models/v2/Xenova/nli-deberta-v3-xsmall/config.json
          curl --fail --retry 4 --retry-all-errors -L "$NLI/added_tokens.json" -o artifact-bundle/models/v2/Xenova/nli-deberta-v3-xsmall/added_tokens.json
          curl --fail --retry 4 --retry-all-errors -L "$NLI/special_tokens_map.json" -o artifact-bundle/models/v2/Xenova/nli-deberta-v3-xsmall/special_tokens_map.json

      - name: Verify exact hashes, sizes, and evaluator-compatible SciFact count
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("artifact-bundle")

          expected = {
              "scifact/claims_dev.jsonl": ("86f0435d08fdb65d1aa41d1472684f57e6e71930626497bdf4d7a9ec1a632217", None),
              "scifact/corpus.jsonl": ("b8d6c89624cb2ed74dee8938effc4f5d8bd2086887880af8110d64be4ceade62", None),
              "models/v2/Xenova/all-MiniLM-L6-v2/onnx/model_quantized.onnx": ("afdb6f1a0e45b715d0bb9b11772f032c399babd23bfc31fed1c170afc848bdb1", 22972370),
              "models/v2/Xenova/all-MiniLM-L6-v2/tokenizer.json": ("da0e79933b9ed51798a3ae27893d3c5fa4a201126cef75586296df9b4d2c62a0", 711661),
              "models/v2/Xenova/all-MiniLM-L6-v2/tokenizer_config.json": ("9261e7d79b44c8195c1cada2b453e55b00aeb81e907a6664974b4d7776172ab3", 366),
              "models/v2/Xenova/all-MiniLM-L6-v2/config.json": ("7135149f7cffa1a573466c6e4d8423ed73b62fd2332c575bf738a0d033f70df7", 650),
              "models/v2/Xenova/all-MiniLM-L6-v2/vocab.txt": ("07eced375cec144d27c900241f3e339478dec958f92fddbc551f295c992038a3", 231508),
              "models/v2/Xenova/all-MiniLM-L6-v2/special_tokens_map.json": ("b6d346be366a7d1d48332dbc9fdf3bf8960b5d879522b7799ddba59e76237ee3", 125),
              "models/v2/Xenova/nli-deberta-v3-xsmall/onnx/model_quantized.onnx": ("3fac2500c45c75af42c7711de0d1b93d59577456100208be0dc1f9e8811946b6", 87246587),
              "models/v2/Xenova/nli-deberta-v3-xsmall/tokenizer.json": ("a86f883318afa11c8c10466f1bf4efaeb6ded28a52cbe57217a8fa0d0a2a87df", 8656551),
              "models/v2/Xenova/nli-deberta-v3-xsmall/tokenizer_config.json": ("d8d3bb123b99317634d5ee3d1d2d8b2ddb01510a0654687fc2639a5347a7291f", 384),
              "models/v2/Xenova/nli-deberta-v3-xsmall/config.json": ("ec0bd14cc28640326474399cd61d38ccd52b64900228799d0f81debda8c4bc53", 1038),
              "models/v2/Xenova/nli-deberta-v3-xsmall/added_tokens.json": ("dc046d04c9b0ada7ae6f1dc89c465801799acdf0c9a6aab8c15a1b2d5ca4e91f", 23),
              "models/v2/Xenova/nli-deberta-v3-xsmall/special_tokens_map.json": ("311de3f4eed9d76a43bf0d71f10e62e086ca65ccce9f15d5da0d2098bf519ecc", 173),
          }

          def sha256(p):
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024*1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          for rel, (want_sha, want_size) in expected.items():
              p = root / rel
              assert p.exists(), rel
              assert sha256(p) == want_sha, (rel, sha256(p), want_sha)
              if want_size is not None:
                  assert p.stat().st_size == want_size, (rel, p.stat().st_size, want_size)

          claims = [json.loads(x) for x in (root/"scifact/claims_dev.jsonl").read_text().splitlines() if x.strip()]
          corpus = [json.loads(x) for x in (root/"scifact/corpus.jsonl").read_text().splitlines() if x.strip()]
          passage_judgments = 0
          for claim in claims:
              evidence = claim.get("evidence", {})
              for rationales in evidence.values():
                  passage_judgments += len(rationales)
              for cited_id in claim.get("cited_doc_ids", []):
                  if str(cited_id) not in evidence:
                      passage_judgments += 1

          assert len(claims) == 300, len(claims)
          assert len(corpus) == 5183, len(corpus)
          assert passage_judgments == 469, passage_judgments

          (root/"SHA256SUMS.txt").write_text("\n".join(f"{sha256(root/rel)}  {rel}" for rel in expected) + "\n")
          (root/"ARTIFACT_PROVENANCE.txt").write_text(
              "TruthLens V2.4 exact external artifact bundle\n"
              "SciFact: vidi-deshp12/scifact-claim-verification @ 051b5245aa9d4b98c1302920cc5e4958b9e30ef9\n"
              "MiniLM mirror: Sagesheep/NarrativeEngine-P @ 463cdd7853954fb904e8bddf863001ae61726796\n"
              "NLI mirror: ElicoftZ/CotoLyrics-alpha @ 487f0c6d1b2ec41ef8e7c1c2266515a2caeb9738\n"
              "MiniLM seal: q8@afdb6f1a\n"
              "NLI seal: q8@3fac2500\n"
              "SciFact evaluator-compatible gold passage count: 469\n"
          )

          print("VERIFIED: hashes, sizes, claims=300, corpus=5183, gold_passage_judgments=469")
          PY

      - name: Upload verified bundle
        uses: actions/upload-artifact@v4
        with:
          name: truthlens-v2.4-exact-artifacts-corrected
          path: artifact-bundle
          if-no-files-found: error
          retention-days: 7
