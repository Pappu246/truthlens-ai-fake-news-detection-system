name: FEVEROUS Index Regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/benchmarks/v3FeverousPrepareCandidates.py'
      - 'scripts/benchmarks/v3FeverousPrepareCandidatesTests.py'
      - '.github/workflows/feverous-index-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    name: Validate bounded and recoverable FTS5 index build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile candidate builder and regression test
        run: |
          python -m py_compile scripts/benchmarks/v3FeverousPrepareCandidates.py
          python -m py_compile scripts/benchmarks/v3FeverousPrepareCandidatesTests.py
      - name: Test index creation and interrupted-build recovery
        run: python scripts/benchmarks/v3FeverousPrepareCandidatesTests.py
