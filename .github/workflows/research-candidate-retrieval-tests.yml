name: Temporary research candidate retrieval regression

'on':
  pull_request:
    branches:
      - research/fever-retrieval-test-base-20261028
    paths:
      - scripts/benchmarks/v3FeverPrepareCandidates.py
      - scripts/benchmarks/v3FeverousPrepareCandidates.py
      - scripts/benchmarks/v3FeverPrepareCandidatesTests.py
      - scripts/benchmarks/v3FeverousPrepareCandidatesTests.py
  push:
    branches:
      - research/fever-retrieval-test-base-20261028

permissions:
  contents: read

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run FEVER candidate preparation regression
        run: python scripts/benchmarks/v3FeverPrepareCandidatesTests.py
      - name: Run FEVEROUS candidate preparation regression
        run: python scripts/benchmarks/v3FeverousPrepareCandidatesTests.py
