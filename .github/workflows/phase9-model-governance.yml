name: Phase 9 model governance
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/train_isot_canonical.py"
      - "scripts/evaluate_liar_candidate.py"
      - "scripts/promote_model.py"
      - "scripts/audit_finefake_archive.py"
      - "scripts/evaluate_finefake_candidate.py"
      - "scripts/test_evaluate_finefake_candidate.py"
      - "docs/FINEFAKE_EXTERNAL_EVALUATION.md"
      - "backend/tests/test_phase9_model_governance.py"
      - "docs/ML_UPGRADE_PROGRESS.md"
      - "docs/ml_upgrade_status.json"
      - ".github/workflows/phase9-model-governance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt datasketch pytest
      - run: python -m pytest backend/tests/test_phase9_model_governance.py scripts/test_evaluate_finefake_candidate.py -q
      - run: python -m py_compile scripts/train_isot_canonical.py scripts/evaluate_liar_candidate.py scripts/promote_model.py scripts/audit_finefake_archive.py scripts/evaluate_finefake_candidate.py
