name: Phase 9 model governance
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/train_isot_canonical.py"
      - "scripts/evaluate_liar_candidate.py"
      - "scripts/promote_model.py"
      - "backend/tests/test_phase9_model_governance.py"
      - "docs/ML_UPGRADE_PROGRESS.md"
      - "docs/ml_upgrade_status.json"
      - ".github/workflows/phase9-model-governance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt datasketch pytest
      - run: python -m pytest backend/tests/test_phase9_model_governance.py -q
      - run: python -m py_compile scripts/train_isot_canonical.py scripts/evaluate_liar_candidate.py scripts/promote_model.py
