name: Publisher-Disjoint External Article Candidate (Research Only)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/prepare_external_source_disjoint_data.py
      - scripts/test_prepare_external_source_disjoint_data.py
      - scripts/train_polyglot_source_heldout_candidate.py
      - scripts/test_train_polyglot_source_heldout_candidate.py
      - scripts/evaluate_polyglot_external_disjoint_candidate.py
      - .github/workflows/polyglot-external-disjoint-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truthlens-polyglot-external-disjoint-validation
  cancel-in-progress: false

jobs:
  candidate:
    name: Prepare, train and score a source-disjoint research candidate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"

      - name: Install pinned model-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-model.txt openpyxl==3.1.5 publicsuffix2==2.20191221 pytest

      - name: Test source exclusion, label mapping and corpus preparation
        run: python -m pytest scripts/test_train_polyglot_source_heldout_candidate.py scripts/test_prepare_external_source_disjoint_data.py -q

      - name: Download and verify pinned PolyglotFakeFacts archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --connect-timeout 30 --max-time 600 --retry 2 --retry-all-errors --retry-delay 3 \
            --user-agent "TruthLens-External-Source-Disjoint-Research/1.0" \
            "https://data.mendeley.com/public-api/zip/8yfrm6z9dx/download/1" -o /tmp/polyglotfakefacts-v2.zip
          echo "06762bfccc55c3236e51bab2d8907218c4c2705e84e3932a5587d29f9879016e  /tmp/polyglotfakefacts-v2.zip" | sha256sum --check -
          mkdir -p /tmp/polyglot-workbooks
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive = Path("/tmp/polyglotfakefacts-v2.zip")
          with zipfile.ZipFile(archive) as zf:
              if zf.testzip():
                  raise SystemExit("PolyglotFakeFacts archive integrity check failed")
              for wanted in ("Fake.xlsx", "Real.xlsx"):
                  matches = [name for name in zf.namelist() if Path(name).name.lower() == wanted.lower()]
                  if len(matches) != 1:
                      raise SystemExit(f"Expected one {wanted}, found {matches}")
                  (Path("/tmp/polyglot-workbooks") / wanted).write_bytes(zf.read(matches[0]))
          PY

      - name: Resolve official Zenodo record and verify license/checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --connect-timeout 20 --max-time 60 \
            "https://zenodo.org/api/records/18135595" -o /tmp/zenodo-record.json
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          record = json.loads(Path("/tmp/zenodo-record.json").read_text())
          if record.get("id") != 18135595:
              raise SystemExit("Zenodo record ID mismatch")
          metadata = record.get("metadata", {})
          license_id = ((metadata.get("license") or {}).get("id") or "").lower()
          if "cc-by-4.0" not in license_id and "cc by 4.0" not in license_id:
              raise SystemExit(f"Unexpected dataset license metadata: {license_id!r}")
          expected = "64b4e8888f95ec104611de9d01ffe903"
          matches = [item for item in record.get("files", []) if "datasets" in item.get("key", "").lower()]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one dataset ZIP in the official Zenodo record")
          item = matches[0]
          checksum = item.get("checksum", "")
          if checksum.startswith("md5:"):
              checksum = checksum[4:]
          if checksum.lower() != expected:
              raise SystemExit(f"Zenodo archive checksum mismatch: {checksum}")
          download_url = item.get("links", {}).get("content") or item.get("links", {}).get("download")
          if not download_url:
              download_url = f"https://zenodo.org/records/18135595/files/{quote(item['key'], safe='')}?download=1"
          Path("/tmp/zenodo-dataset-url.txt").write_text(download_url, encoding="utf-8")
          print(json.dumps({"record_id": record["id"], "title": metadata.get("title"), "license": license_id, "md5": expected}, indent=2))
          PY

      - name: Download pinned external full-article corpus
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --connect-timeout 30 --max-time 1200 --retry 2 --retry-all-errors --retry-delay 3 \
            "$(cat /tmp/zenodo-dataset-url.txt)" -o /tmp/zenodo-datasets.zip
          echo "64b4e8888f95ec104611de9d01ffe903  /tmp/zenodo-datasets.zip" | md5sum --check -

      - name: Prepare external publisher exclusions and near-duplicate-filtered evaluation set
        run: |
          set -euo pipefail
          python scripts/prepare_external_source_disjoint_data.py \
            --external-archive /tmp/zenodo-datasets.zip \
            --candidate-dataset-dir /tmp/polyglot-workbooks \
            --output-dir /tmp/truthlens-external-source-disjoint
          mkdir -p artifacts/independent-data
          cp /tmp/truthlens-external-source-disjoint/external-preparation-summary.json artifacts/independent-data/

      - name: Snapshot canonical production artifact
        run: |
          set -euo pipefail
          sha256sum data/saved_model_artifacts.json > /tmp/truthlens-production-artifact.before.sha256
          rm -rf artifacts/models
          mkdir -p artifacts/models

      - name: Train publisher-disjoint candidate with frozen runtime policy
        id: train
        run: |
          set -euo pipefail
          python scripts/train_polyglot_source_heldout_candidate.py \
            --dataset-dir /tmp/polyglot-workbooks \
            --archive /tmp/polyglotfakefacts-v2.zip \
            --output-dir artifacts/models \
            --max-features 16000 \
            --min-df 2 \
            --exclude-publisher-fingerprints /tmp/truthlens-external-source-disjoint/external-publisher-fingerprints.json \
            | tee artifacts/independent-data/training-summary.json
          candidate_dir="$(find artifacts/models -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$candidate_dir"
          echo "candidate_dir=$candidate_dir" >> "$GITHUB_OUTPUT"
          echo "model_version=$(basename "$candidate_dir")" >> "$GITHUB_OUTPUT"

      - name: Evaluate external full articles under frozen policy
        id: external_eval
        run: |
          set -euo pipefail
          python scripts/evaluate_polyglot_external_disjoint_candidate.py \
            --candidate-dir "${{ steps.train.outputs.candidate_dir }}" \
            --external-jsonl /tmp/truthlens-external-source-disjoint/external-disjoint-evaluation.jsonl \
            --source-exclusions /tmp/truthlens-external-source-disjoint/external-publisher-fingerprints.json \
            --preparation-summary /tmp/truthlens-external-source-disjoint/external-preparation-summary.json \
            --output "${{ steps.train.outputs.candidate_dir }}/external_validation.json"
          cp "${{ steps.train.outputs.candidate_dir }}/external_validation.json" artifacts/independent-data/

      - name: Set up Node.js
        if: always() && steps.train.outcome == 'success'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        if: always() && steps.train.outcome == 'success'
        run: npm ci

      - name: Type-check and build
        if: always() && steps.train.outcome == 'success'
        run: npm run lint

      - name: Exact Python-to-Node candidate inference parity
        if: always() && steps.train.outcome == 'success'
        env:
          RUNTIME_MODEL_VERSION: ${{ steps.train.outputs.model_version }}
        run: npm run test:runtime-model-parity

      - name: Verify canonical production artifact was not changed
        if: always()
        run: |
          set -euo pipefail
          if [ -f /tmp/truthlens-production-artifact.before.sha256 ]; then
            sha256sum --check /tmp/truthlens-production-artifact.before.sha256
          else
            echo "Production artifact snapshot was not created; no training artifact is eligible for promotion."
          fi

      - name: Upload candidate-only validation diagnostics (no external article text)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-polyglot-external-disjoint-candidate-${{ github.run_number }}
          path: |
            artifacts/independent-data/
            artifacts/models/*/model_artifact.json
            artifacts/models/*/manifest.json
            artifacts/models/*/source_holdout_validation.json
            artifacts/models/*/external_validation.json
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
