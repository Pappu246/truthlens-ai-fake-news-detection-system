name: Phase 2 AVeriTeC End-to-End Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/v2AveritecEndToEnd.ts'
      - 'scripts/mergeAveritecShards.mjs'
      - '.github/workflows/phase-2-averitec-e2e.yml'
      - 'scripts/benchmarks/v3MaterializeScoringAssets.mjs'
      - 'scripts/benchmarks/v3RangeDownload.mjs'

concurrency:
  group: truthlens-phase2-averitec-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AV_DATA_COMMIT: '7c62d1ec8df3fb560d6efe2b85fa191135636f81'
  AV_DATA_URL: 'https://raw.githubusercontent.com/MichSchli/AVeriTeC/7c62d1ec8df3fb560d6efe2b85fa191135636f81/data/dev.json'
  AV_DATA_SHA256: '499793726b4a5406780928a3d9dedc48d6dd53de778f22437d129cacdb08e300'
  AV_STORE_REVISION: '26238ae'
  AV_STORE_URL: 'https://huggingface.co/chenxwh/AVeriTeC/resolve/26238ae/data_store/knowledge_store/dev_knowledge_store.zip'
  AV_STORE_SHA256: '021e258cd6fb5fe6d627a4667d663e95c184c966939c15124df9206142fc2212'
  AV_OFFICIAL_COMMIT: '7c62d1ec8df3fb560d6efe2b85fa191135636f81'
  NODE_OPTIONS: '--max-old-space-size=6144 --expose-gc'
  TRUTHLENS_V2_ML_CALL_TIMEOUT_MS: '600000'

jobs:
  shard:
    name: AVeriTeC shard ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 0
            count: 125
            end: 125
          - start: 125
            count: 125
            end: 250
          - start: 250
            count: 125
            end: 375
          - start: 375
            count: 125
            end: 500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: npm ci
      - name: Provision research-only Transformers.js runtime
        shell: bash
        run: |
          set -uo pipefail
          log_file="${RUNNER_TEMP}/truthlens-transformers-install.log"
          for attempt in 1 2 3; do
            echo "Installing research-only Transformers.js runtime (attempt ${attempt}/3)"
            if npm install --no-save --package-lock=false @huggingface/transformers@4.3.0 2>&1 | tee "${log_file}"; then
              exit 0
            else
              status=$?
            fi
            if ! grep -Eq 'ETIMEDOUT|ENETUNREACH|ECONNRESET|EAI_AGAIN|socket hang up|network timeout' "${log_file}"; then
              echo "Install failed for a non-transient reason; do not retry blindly."
              exit "${status}"
            fi
            if [ "${attempt}" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "::warning::External package host timed out; retrying after ${delay}s."
              sleep "${delay}"
            fi
          done
          echo "Could not install Transformers.js after transient-network retries."
          exit 1
      - name: Provision sealed TruthLens V2 pretrained models
        run: npm run download:v2-models
      - name: Materialize AVeriTeC dev claims
        run: |
          set -euo pipefail
          mkdir -p data/external/averitec artifacts/phase2/averitec
          curl --fail --retry 4 --retry-all-errors --location --connect-timeout 30 --max-time 600 "$AV_DATA_URL" -o data/external/averitec/dev.json
          test "$(sha256sum data/external/averitec/dev.json | cut -d' ' -f1)" = "$AV_DATA_SHA256"
          test "$(node -e "const d=require('./data/external/averitec/dev.json'); process.stdout.write(String(d.length))")" = "500"
      - name: Download pinned AVeriTeC dev evidence store
        run: |
          set -euo pipefail
          curl --fail --retry 4 --retry-all-errors --location --connect-timeout 30 --max-time 10800 "$AV_STORE_URL" -o artifacts/phase2/averitec/dev_knowledge_store.zip
          test "$(sha256sum artifacts/phase2/averitec/dev_knowledge_store.zip | cut -d' ' -f1)" = "$AV_STORE_SHA256"
      - name: Verify benchmark runner TypeScript build
        run: npx tsc --noEmit --pretty false
      - name: Run AVeriTeC shard
        env:
          START: ${{ matrix.start }}
          COUNT: ${{ matrix.count }}
        run: |
          set -euo pipefail
          npx tsx scripts/v2AveritecEndToEnd.ts --start-claim="$START" --max-claims="$COUNT" --coarse-bm25-k=2000 --embedding-batch=64 --output-dir="artifacts/v2-averitec-e2e/shard-$START"
      - name: Assert shard completeness
        env:
          START: ${{ matrix.start }}
          COUNT: ${{ matrix.count }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          start = int(os.environ["START"]); count = int(os.environ["COUNT"])
          root = Path(f"artifacts/v2-averitec-e2e/shard-{start}")
          predictions = json.loads((root/"predictions.json").read_text())
          provenance = json.loads((root/"provenance.json").read_text())
          assert len(predictions) == count
          assert provenance["claim_range"]["start_claim"] == start
          assert provenance["claim_range"]["claim_count"] == count
          assert provenance["evaluation_count"] == count
          print({"start":start,"count":count,"scope":provenance["evaluation_scope"]})
          PY
      - name: Upload AVeriTeC shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: truthlens-phase2-averitec-shard-${{ matrix.start }}
          path: artifacts/v2-averitec-e2e/shard-${{ matrix.start }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate 500-claim AVeriTeC benchmark
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          # The pinned official evaluator depends on leven==1.0.4, which fails to build on CPython 3.11.
          python-version: '3.10'
      - name: Download AVeriTeC shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: truthlens-phase2-averitec-shard-*
          path: artifacts/v2-averitec-shards
          merge-multiple: false
      - name: Merge and validate 500-claim prediction set
        run: node scripts/mergeAveritecShards.mjs --input-dir=artifacts/v2-averitec-shards --output-dir=artifacts/v2-averitec-e2e
      - name: Materialize pinned AVeriTeC dev claims for official evaluation
        run: |
          set -euo pipefail
          mkdir -p data/external/averitec
          curl --fail --retry 4 --retry-all-errors --location --connect-timeout 30 --max-time 600 "$AV_DATA_URL" -o data/external/averitec/dev.json
          test "$(sha256sum data/external/averitec/dev.json | cut -d' ' -f1)" = "$AV_DATA_SHA256"
          test "$(node -e "const d=require('./data/external/averitec/dev.json'); process.stdout.write(String(d.length))")" = "500"
      - name: Fetch pinned official evaluator
        run: |
          set -euo pipefail
          mkdir -p artifacts/v2-averitec-e2e/official-evaluator
          curl --fail --location "https://raw.githubusercontent.com/MichSchli/AVeriTeC/$AV_OFFICIAL_COMMIT/eval.py" -o artifacts/v2-averitec-e2e/official-evaluator/eval.py
          curl --fail --location "https://raw.githubusercontent.com/MichSchli/AVeriTeC/$AV_OFFICIAL_COMMIT/utils.py" -o artifacts/v2-averitec-e2e/official-evaluator/utils.py
      - name: Install official evaluator dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input "numpy==2.1.3" "scipy==1.14.1" "scikit-learn==1.5.2" "nltk==3.9.1" "leven==1.0.4"
          python -m nltk.downloader punkt punkt_tab wordnet
      - name: Run official AVeriTeC evaluator
        run: python artifacts/v2-averitec-e2e/official-evaluator/eval.py --predictions artifacts/v2-averitec-e2e/predictions.json --references data/external/averitec/dev.json > artifacts/v2-averitec-e2e/official-evaluation.txt
      - name: Parse official metrics
        run: |
          set -euo pipefail
          grep -q "AVeriTeC evaluation:" artifacts/v2-averitec-e2e/official-evaluation.txt
          grep -q "Averitec scores:" artifacts/v2-averitec-e2e/official-evaluation.txt
          python - <<'PY'
          import json,re,os
          from pathlib import Path
          text=Path("artifacts/v2-averitec-e2e/official-evaluation.txt").read_text()
          out={"evaluation_count":len(json.loads(Path("artifacts/v2-averitec-e2e/predictions.json").read_text())),"benchmark_id":"averitec","protocol_version":"truthlens-v3-benchmark-protocol-v1","evaluation_scope":"dev_500_claims","evaluator":{"repository":"MichSchli/AVeriTeC","commit":os.environ["AV_OFFICIAL_COMMIT"]},"metrics":{"veracity_f1":{},"averitec_veracity":{},"averitec_justification":{}},"generated_at":__import__("datetime").datetime.utcnow().isoformat()+"Z","truthlens_git_sha":os.environ.get("GITHUB_SHA"),"workflow_run_id":os.environ.get("GITHUB_RUN_ID")}
          section=None
          for line in text.splitlines():
              line=line.strip()
              if line=="Veracity F1 scores:": section="veracity_f1"; continue
              if line=="Averitec scores:": section="averitec"; continue
              m=re.match(r"\*\s*(.+?):\s*([0-9.eE+-]+)$",line)
              if not m: continue
              key,value=m.group(1),float(m.group(2))
              if section=="veracity_f1": out["metrics"]["veracity_f1"][key]=value
              elif section=="averitec":
                  mm=re.match(r"(Veracity|Justification) scores \(meteor @ ([0-9.]+)\)",key,re.I)
                  if mm: out["metrics"]["averitec_veracity" if mm.group(1).lower()=="veracity" else "averitec_justification"][mm.group(2)]=value
          assert all(out["metrics"][g] for g in ("veracity_f1","averitec_veracity","averitec_justification"))
          Path("artifacts/v2-averitec-e2e/official-evaluation.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - name: Write reproducibility manifest
        run: |
          cat > artifacts/v2-averitec-e2e/reproducibility-manifest.json <<EOF
          {"benchmark":"AVeriTeC","split":"dev","claims":500,"claims_sha256":"$AV_DATA_SHA256","official_data_commit":"$AV_DATA_COMMIT","evidence_store_revision":"$AV_STORE_REVISION","evidence_store_sha256":"$AV_STORE_SHA256","truthlens_git_sha":"$GITHUB_SHA","workflow_run_id":"$GITHUB_RUN_ID","shard_count":4,"shard_size":125,"production_boundary":"research_only_no_production_model_threshold_or_runtime_change","gold_evidence_in_retrieval":false}
          EOF
          sha256sum artifacts/v2-averitec-e2e/*.json artifacts/v2-averitec-e2e/*.txt | sort > artifacts/v2-averitec-e2e/artifact-file-sha256.txt
      - name: Upload complete AVeriTeC score artifact
        uses: actions/upload-artifact@v4
        with:
          name: truthlens-phase2-averitec-e2e-final
          path: artifacts/v2-averitec-e2e/
          if-no-files-found: error
          retention-days: 90

  syntax:
    name: Workflow syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install dependencies
        run: npm ci
      - name: Check scripts
        run: |
          node --check scripts/mergeAveritecShards.mjs
          npx tsc --noEmit
