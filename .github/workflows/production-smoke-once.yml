name: One-off current production smoke
on:
  push:
    branches:
      - ops/production-smoke-2026-10-23
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Trace legacy URL deprecation in local API runtime
        env:
          NODE_OPTIONS: --trace-deprecation
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { createExpressApp } from './server/appFactory.ts';
          const app = await createExpressApp({ isProduction: true, includeVite: false });
          const server = await new Promise((resolve, reject) => {
            const instance = app.listen(0, '127.0.0.1', () => resolve(instance));
            instance.on('error', reject);
          });
          try {
            const address = server.address();
            const response = await fetch('http://127.0.0.1:' + address.port + '/api/health');
            const payload = await response.json();
            console.log('Local API health:', response.status, payload.status, payload.article_model_version);
            if (response.status !== 200 || payload.status !== 'ok') process.exitCode = 1;
          } finally {
            await new Promise(resolve => server.close(resolve));
          }
          NODE
      - name: Run full smoke suite against production-locked app
        env:
          NODE_ENV: production
          PORT: 3000
        run: |
          set -euo pipefail
          PORT=3000 NODE_ENV=production npx tsx server.ts > /tmp/truthlens-local-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/tmp/truthlens-health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/truthlens-health.json
          npx tsx scripts/productionSmokeTest.ts http://127.0.0.1:3000
