name: Publisher-Held-Out Article Candidate (Research Only)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/train_polyglot_source_heldout_candidate.py
      - scripts/test_train_polyglot_source_heldout_candidate.py
      - requirements-model.txt
      - .github/workflows/polyglot-source-heldout-candidate.yml
      - scripts/isot_data_pipeline.py
      - server/mlEngine.ts
      - scripts/runtimeModelParityTests.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truthlens-polyglot-source-heldout-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and validate publisher-held-out candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"

      - name: Install pinned model-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-model.txt openpyxl==3.1.5 pytest

      - name: Test source grouping and split integrity
        run: python -m pytest scripts/test_train_polyglot_source_heldout_candidate.py -q

      - name: Download and validate official PolyglotFakeFacts archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --connect-timeout 20 --max-time 600 \
            --retry 2 --retry-all-errors --retry-delay 3 \
            --user-agent "TruthLens-Source-Heldout-Research/1.0" \
            "https://data.mendeley.com/public-api/zip/8yfrm6z9dx/download/1" \
            -o /tmp/polyglotfakefacts-outer.zip
          mkdir -p /tmp/polyglot-workbooks
          python - <<'PY'
          import hashlib, io, json, zipfile
          from pathlib import Path
          expected = "06762bfccc55c3236e51bab2d8907218c4c2705e84e3932a5587d29f9879016e"
          outer_path = Path("/tmp/polyglotfakefacts-outer.zip")
          with zipfile.ZipFile(outer_path) as outer:
              if outer.testzip():
                  raise SystemExit("Outer Mendeley ZIP failed integrity check.")
              inner_names = [n for n in outer.namelist() if Path(n).name.lower() == "polyglotfakefacts-v2.zip"]
              if len(inner_names) != 1:
                  raise SystemExit(f"Expected one inner PolyglotFakeFacts ZIP, found {inner_names}")
              inner_bytes = outer.read(inner_names[0])
          actual = hashlib.sha256(inner_bytes).hexdigest()
          if actual != expected:
              raise SystemExit(f"Inner dataset SHA-256 mismatch: {actual}")
          inner_path = Path("/tmp/polyglotfakefacts-v2.zip")
          inner_path.write_bytes(inner_bytes)
          with zipfile.ZipFile(io.BytesIO(inner_bytes)) as inner:
              if inner.testzip():
                  raise SystemExit("Pinned inner dataset ZIP failed integrity check.")
              for wanted in ("fake.xlsx", "real.xlsx"):
                  matches = [n for n in inner.namelist() if Path(n).name.lower() == wanted]
                  if len(matches) != 1:
                      raise SystemExit(f"Expected exactly one {wanted}: {matches}")
                  output = Path("/tmp/polyglot-workbooks") / Path(matches[0]).name
                  output.write_bytes(inner.read(matches[0]))
          result = {
              "outer_archive_sha256": hashlib.sha256(outer_path.read_bytes()).hexdigest(),
              "inner_archive_sha256": actual,
              "inner_archive_bytes": len(inner_bytes),
              "workbooks": {
                  p.name: {"bytes": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
                  for p in sorted(Path("/tmp/polyglot-workbooks").glob("*.xlsx"))
              },
              "license": "CC BY 4.0",
              "release_gate_note": "This corpus does not by itself prove independence from candidate-fitting sources."
          }
          if set(result["workbooks"]) != {"Fake.xlsx", "Real.xlsx"}:
              raise SystemExit(f"Workbook filenames differ from expected canonical names: {list(result['workbooks'])}")
          Path("artifacts/independent-data").mkdir(parents=True, exist_ok=True)
          Path("artifacts/independent-data/source-archive-metadata.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          PY

      - name: Snapshot canonical production model artifact
        run: |
          set -euo pipefail
          sha256sum data/saved_model_artifacts.json > /tmp/truthlens-production-artifact.before.sha256
          rm -rf artifacts/models
          mkdir -p artifacts/models

      - name: Train publisher-held-out research candidate
        run: |
          set -euo pipefail
          python scripts/train_polyglot_source_heldout_candidate.py \
            --dataset-dir /tmp/polyglot-workbooks \
            --archive /tmp/polyglotfakefacts-v2.zip \
            --output-dir artifacts/models \
            --max-features 16000 \
            --min-df 2 | tee artifacts/independent-data/training-summary.json

      - name: Validate source holdout and explicit candidate-only status
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          candidates = list(Path("artifacts/models").glob("*/model_artifact.json"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one candidate artifact; found {candidates}")
          model_path = candidates[0]
          candidate_dir = model_path.parent
          report = json.loads((candidate_dir / "source_holdout_validation.json").read_text())
          manifest = json.loads((candidate_dir / "manifest.json").read_text())
          artifact = json.loads(model_path.read_text())
          assert manifest["artifact_sha256"] == hashlib.sha256(model_path.read_bytes()).hexdigest()
          assert manifest["production_eligible"] is False
          assert manifest["promotion_status"] == "CANDIDATE_ONLY"
          assert artifact["thresholds"]["fake_threshold"] == 0.98
          assert artifact["thresholds"]["real_threshold"] == 0.35
          assert report["publisher_separation"]["status"] == "PASS_WITHIN_DATASET"
          assert all(not items for items in report["publisher_separation"]["overlap"].values())
          assert report["release_gate"]["passed"] is False
          assert report["release_gate"]["independent_external_dataset"] is False
          assert report["candidate"]["production_eligible"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Candidate quality report (diagnostic only)\n\n")
              summary.write(f"- Candidate: {artifact['model_version']}\n")
              summary.write(f"- Publisher-held-out rows: {report['release_gate']['publisher_heldout_articles']}\n")
              summary.write(f"- Raw held-out balanced accuracy: {artifact['metrics']['publisher_heldout_test_raw']['balanced_accuracy']:.4f}\n")
              summary.write(f"- Frozen-policy held-out balanced accuracy: {artifact['metrics']['publisher_heldout_test_frozen_policy']['operational_balanced_accuracy_abstentions_count_as_not_correct']:.4f}\n")
              summary.write("- Release gate: BLOCKED — same-dataset source holdout is not an independent external holdout.\n")
          print(json.dumps({
              "model_version": artifact["model_version"],
              "candidate_sha256": manifest["artifact_sha256"],
              "publisher_heldout_metrics": artifact["metrics"]["publisher_heldout_test_raw"],
              "frozen_policy": artifact["metrics"]["publisher_heldout_test_frozen_policy"],
              "release_gate": report["release_gate"]
          }, indent=2))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run lint

      - name: Exact Python-to-Node candidate inference parity
        run: |
          set -euo pipefail
          MODEL_PATH="$(find artifacts/models -mindepth 2 -maxdepth 2 -type f -name model_artifact.json -print -quit)"
          test -n "$MODEL_PATH"
          MODEL_VERSION="$(basename "$(dirname "$MODEL_PATH")")"
          RUNTIME_MODEL_VERSION="$MODEL_VERSION" npm run test:runtime-model-parity

      - name: Verify canonical production artifact was not changed
        run: |
          set -euo pipefail
          sha256sum --check /tmp/truthlens-production-artifact.before.sha256

      - name: Upload research diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-polyglot-source-heldout-candidate
          path: |
            artifacts/independent-data
            artifacts/models
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
