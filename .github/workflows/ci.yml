name: CI

on:
  push:
    branches:
      - main
      - "ml-upgrade-*"
      - "research/truthlens-v2-model-quality"
      - "gate14-*"
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'server/**'
      - 'api/**'
      - 'backend/**'
      - 'scripts/productionSmokeTest.ts'
      - 'scripts/contractTests.ts'
      - 'scripts/vercel-sim.ts'
      - 'scripts/regressionVerdictTests.ts'
      - 'scripts/claimModelTests.ts'
      - 'scripts/claimParity.ts'
      - 'scripts/evidenceTests.ts'
      - 'scripts/gate14RemainingTests.ts'
      - 'scripts/evidenceBenchmark.ts'
      - 'scripts/evaluate_liar.py'
      - 'scripts/analysisSignalsSurfaceTests.ts'
      - 'data/test.tsv'
      - 'data/saved_model_artifacts.json'
      - 'data/external_validation.json'
      - 'src/types.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'vercel.json'
      - 'render.yaml'
      - 'index.html'
      - 'metadata.json'
      - 'scripts/validate_open_web_holdout.py'
      - 'scripts/test_validate_open_web_holdout.py'
      - 'docs/research/OPEN_WEB_HOLDOUT_PROTOCOL.md'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Sealed Open-Web holdout integrity contract
        run: python3 scripts/test_validate_open_web_holdout.py

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Article model safety regression
        run: npm run test:model-safety

      - name: Existing verdict regression suite
        run: npm run test:verdicts

      - name: Article pipeline and extraction safety
        run: npm run test:article-pipeline-safety

      - name: Contract tests
        run: npm run test:contracts
 
      - name: API error sanitization tests
        run: npm run test:error-sanitizer

      - name: Analysis claim/evidence signal mapping
        run: npm run test:analysis-signals

      - name: Vercel runtime simulation (trace Node deprecations)
        env:
          NODE_OPTIONS: --trace-deprecation
        run: npm run test:vercel-sim

      - name: Verdict regression tests
        run: npm run test:verdicts

      - name: Claim model tests
        run: npm run test:claim

      - name: Claim model Python/Node parity
        run: npm run test:claim-parity

      - name: Evidence engine tests
        run: npm run test:evidence

      - name: Gate 14 remaining security/calibration tests
        run: npm run test:gate14

      - name: Evidence-specific benchmark
        run: npm run eval:evidence-benchmark

      - name: External model-quality harness smoke
        run: npm run test:v2-model-quality-external-smoke

      - name: Exact production-ensemble LIAR evaluation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/external-validation
          python3 scripts/evaluate_liar.py --output artifacts/external-validation/report.json
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          with Path("data/saved_model_artifacts.json").open(encoding="utf-8") as f:
              artifact = json.load(f)
          with Path("artifacts/external-validation/report.json").open(encoding="utf-8") as f:
              report = json.load(f)

          assert report["status"] == "COMPLETED"
          assert report["model_version"] == artifact["model_version"]
          assert report["model_inference_mode"] == "calibrated_ensemble"
          assert report["evaluation_protocol"]["calibration_members_used"] == 3
          with Path("data/test.tsv").open(encoding="utf-8") as f:
              rows = list(csv.reader(f, delimiter="\t"))
          binary_labels = {"pants-fire", "false", "mostly-true", "true"}
          expected_eligible = sum(1 for row in rows if len(row) > 1 and row[1].strip().lower() in binary_labels)
          assert report["total_test_samples"] == len(rows)
          assert report["eligible_binary_samples"] == expected_eligible
          assert report["excluded_ambiguous_samples"] == len(rows) - expected_eligible
          assert report["dataset_sha256"] == hashlib.sha256(Path("data/test.tsv").read_bytes()).hexdigest()
          assert report["artifact_sha256"] == hashlib.sha256(Path("data/saved_model_artifacts.json").read_bytes()).hexdigest()
          policy = report["production_policy_metrics"]
          assert policy["decided_samples"] + policy["abstained_samples"] == report["eligible_binary_samples"]
          assert policy["total_eligible_samples"] == report["eligible_binary_samples"]
          raw_cm = report["confusion_matrix"]
          assert sum(sum(row) for row in raw_cm["matrix"]) == report["eligible_binary_samples"]
          policy_cm = policy["confusion_matrix"]
          assert sum(sum(row) for row in policy_cm["matrix"]) == policy["decided_samples"]
          assert abs(policy["coverage_ratio"] + policy["abstention_rate"] - 1.0) < 0.0002
          print("LIAR ensemble report integrity: PASS")
          print(f"version={report['model_version']} raw_N={report['eligible_binary_samples']} "
                f"policy_decided={policy['decided_samples']} policy_abstained={policy['abstained_samples']}")
          PY

      - name: Model artifact lifecycle tests
        run: npm run test:artifacts

      - name: SSRF tests
        run: npm run test:ssrf

      - name: V2 pipeline tests
        run: npm run test:v2

      - name: V2 route tests
        run: npm run test:v2-route

      - name: V2 model-quality tests
        run: npm run test:v2-quality

      - name: Research intelligence syntax/config
        run: |
          node --check scripts/researchIntelligence.mjs
          node -e "JSON.parse(require('fs').readFileSync('research/research-intelligence-registry.json', 'utf8')); console.log('Research registry JSON: OK')"

      - name: Phase 2 multi-benchmark protocol
        run: npm run check:phase2-protocol

      - name: Phase 2 protocol regression test
        run: npm run test:phase2-protocol

      - name: Phase 2 benchmark adapter contracts
        run: npm run test:phase2-adapters

      - name: Phase 2 materialization guard
        run: npm run test:phase2-materialization

      - name: Gate 14 release audit
        run: npm run audit:gate14

      - name: Upload evidence/research evaluation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-gate14-evaluation
          path: |
            artifacts/evidence-benchmark/report.json
            artifacts/v2-model-quality/external-harness-smoke.json
            artifacts/external-validation/report.json
          if-no-files-found: warn
