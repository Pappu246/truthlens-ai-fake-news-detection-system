name: CI

on:
  push:
    branches:
      - main
      - "ml-upgrade-*"
      - "research/truthlens-v2-model-quality"
      - "gate14-*"
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'server/**'
      - 'api/**'
      - 'backend/**'
      - 'scripts/productionSmokeTest.ts'
      - 'scripts/contractTests.ts'
      - 'scripts/vercel-sim.ts'
      - 'scripts/regressionVerdictTests.ts'
      - 'scripts/claimModelTests.ts'
      - 'scripts/claimParity.ts'
      - 'scripts/evidenceTests.ts'
      - 'scripts/gate14RemainingTests.ts'
      - 'scripts/evidenceBenchmark.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'vercel.json'
      - 'render.yaml'
      - 'index.html'
      - 'metadata.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Article model safety regression
        run: npm run test:model-safety

      - name: Existing verdict regression suite
        run: npm run test:verdicts

      - name: Article pipeline and extraction safety
        run: npm run test:article-pipeline-safety

      - name: Contract tests
        run: npm run test:contracts

      - name: Vercel runtime simulation (trace Node deprecations)
        env:
          NODE_OPTIONS: --trace-deprecation
        run: npm run test:vercel-sim

      - name: Verdict regression tests
        run: npm run test:verdicts

      - name: Claim model tests
        run: npm run test:claim

      - name: Claim model Python/Node parity
        run: npm run test:claim-parity

      - name: Evidence engine tests
        run: npm run test:evidence

      - name: Gate 14 remaining security/calibration tests
        run: npm run test:gate14

      - name: Evidence-specific benchmark
        run: npm run eval:evidence-benchmark

      - name: External model-quality harness smoke
        run: npm run test:v2-model-quality-external-smoke

      - name: Model artifact lifecycle tests
        run: npm run test:artifacts

      - name: SSRF tests
        run: npm run test:ssrf

      - name: V2 pipeline tests
        run: npm run test:v2

      - name: V2 route tests
        run: npm run test:v2-route

      - name: V2 model-quality tests
        run: npm run test:v2-quality

      - name: Research intelligence syntax/config
        run: |
          node --check scripts/researchIntelligence.mjs
          node -e "JSON.parse(require('fs').readFileSync('research/research-intelligence-registry.json', 'utf8')); console.log('Research registry JSON: OK')"

      - name: Phase 2 multi-benchmark protocol
        run: npm run check:phase2-protocol

      - name: Phase 2 protocol regression test
        run: npm run test:phase2-protocol

      - name: Phase 2 benchmark adapter contracts
        run: npm run test:phase2-adapters

      - name: Phase 2 materialization guard
        run: npm run test:phase2-materialization

      - name: Gate 14 release audit
        run: npm run audit:gate14

      - name: Upload evidence/research evaluation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-gate14-evaluation
          path: |
            artifacts/evidence-benchmark/report.json
            artifacts/v2-model-quality/external-harness-smoke.json
          if-no-files-found: warn
