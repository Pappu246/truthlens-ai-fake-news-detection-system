name: CI

on:
  push:
    branches:
      - main
      - "ml-upgrade-*"
      - "research/truthlens-v2-model-quality"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Contract tests
        run: npm run test:contracts

      - name: Vercel runtime simulation
        run: npm run test:vercel-sim

      - name: Verdict regression tests
        run: npm run test:verdicts

      - name: Claim model tests
        run: npm run test:claim

      - name: Claim model Python/Node parity
        run: npm run test:claim-parity

      - name: Evidence engine tests
        run: npm run test:evidence

      - name: Model artifact lifecycle tests
        run: npm run test:artifacts

      - name: SSRF tests
        run: npm run test:ssrf

      - name: V2 pipeline tests
        run: npm run test:v2

      - name: V2 route tests
        run: npm run test:v2-route

      - name: V2 model-quality tests
        run: npm run test:v2-quality
