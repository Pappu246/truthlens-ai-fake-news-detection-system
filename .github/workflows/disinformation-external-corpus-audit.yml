name: Independent External Dataset Audit (Zenodo v1.1)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/disinformation-external-corpus-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: truthlens-disinformation-corpus-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit the CC BY 4.0 disinformation datasets archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"

      - name: Install pinned publisher-domain parser
        run: python -m pip install publicsuffix2==2.20191221

      - name: Download pinned candidate publisher-fingerprint artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: truthlens-polyglot-source-heldout-candidate
          run-id: 40112758824
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/polyglot-candidate

      - name: Fetch and verify official Zenodo record metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --connect-timeout 20 --max-time 60 \
            "https://zenodo.org/api/records/18135595" -o /tmp/zenodo-record.json
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("/tmp/zenodo-record.json").read_text())
          assert record.get("id") == 18135595, record.get("id")
          files = record.get("files", [])
          matches = [item for item in files if "datasets" in item.get("key", "").lower()]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one dataset ZIP in the published Zenodo record.")
          item = matches[0]
          checksum = item.get("checksum", "")
          if checksum.startswith("md5:"):
              checksum = checksum[4:]
          expected = "64b4e8888f95ec104611de9d01ffe903"
          if checksum.lower() != expected:
              raise SystemExit(f"Zenodo file checksum changed; expected {expected}, got {checksum}")
          metadata = record.get("metadata", {})
          license_id = ((metadata.get("license") or {}).get("id") or "").lower()
          if "cc-by-4.0" not in license_id and "cc by 4.0" not in license_id:
              raise SystemExit(f"Unexpected/missing dataset license metadata: {license_id!r}")
          download_url = item.get("links", {}).get("content") or item.get("links", {}).get("download")
          if not download_url:
              from urllib.parse import quote
              # Zenodo v12 sometimes exposes only the file-metadata link; resolve the
              # binary download URL using the key returned by that official record.
              download_url = f"https://zenodo.org/records/18135595/files/{quote(item['key'], safe='')}?download=1"
          Path("/tmp/zenodo-dataset-url.txt").write_text(download_url, encoding="utf-8")
          print(json.dumps({
              "record_id": record["id"],
              "doi": metadata.get("doi"),
              "title": metadata.get("title"),
              "license_id": license_id,
              "file_size": item.get("size"),
              "checksum": "md5:" + checksum,
              "file_url_resolved_from_official_record": True
          }, indent=2))
          PY

      - name: Download and hash-check the dataset archive
        shell: bash
        run: |
          set -euo pipefail
          FILE_URL="$(cat /tmp/zenodo-dataset-url.txt)"
          curl --fail --location --show-error --connect-timeout 20 --max-time 900 \
            --retry 2 --retry-all-errors --retry-delay 3 \
            "$FILE_URL" -o /tmp/zenodo-datasets.zip
          printf "%s  %s\n" "64b4e8888f95ec104611de9d01ffe903" /tmp/zenodo-datasets.zip | md5sum --check -

      - name: Stream-audit external article schema and eligible source-labelled text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/external-corpus-audit
          python - <<'PY'
          import csv, hashlib, io, json, re, zipfile
          # News/article fields can exceed Python csv's 128 KiB default.
          csv.field_size_limit(50 * 1024 * 1024)
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit
          from publicsuffix2 import get_sld

          archive = Path("/tmp/zenodo-datasets.zip")
          candidate_reports = list(Path("/tmp/polyglot-candidate").rglob("source_holdout_validation.json"))
          if len(candidate_reports) != 1:
              raise SystemExit(f"Expected exactly one pinned candidate report, found {len(candidate_reports)}")
          candidate_report = json.loads(candidate_reports[0].read_text(encoding="utf-8"))
          expected_model_version = "polyglot-source-svm-51ebe2298575"
          expected_artifact_sha256 = "7a3e4edc45396fc164f10768bf5f7cb00d817223a688b35c6f90b9d58dd3a986"
          if candidate_report.get("candidate", {}).get("model_version") != expected_model_version:
              raise SystemExit("Pinned candidate model version does not match audit protocol")
          if candidate_report.get("candidate", {}).get("artifact_sha256") != expected_artifact_sha256:
              raise SystemExit("Pinned candidate artifact hash does not match audit protocol")
          candidate_domain_fingerprints = set(
              candidate_report.get("publisher_separation", {}).get("domain_fingerprints", {}).get("candidate_development_corpus", [])
          )
          if len(candidate_domain_fingerprints) != 398 or any(not re.fullmatch(r"[0-9a-f]{64}", fp) for fp in candidate_domain_fingerprints):
              raise SystemExit("Pinned candidate development publisher fingerprints are missing or malformed")
          candidate_dataset_sha256 = candidate_report.get("dataset", {}).get("archive_sha256")
          if candidate_dataset_sha256 != "06762bfccc55c3236e51bab2d8907218c4c2705e84e3932a5587d29f9879016e":
              raise SystemExit("Pinned candidate dataset hash does not match audit protocol")
          text_aliases = {"articletext", "fulltext", "fullarticle", "articlebody", "body", "content", "text", "newscontent", "articlecontent"}
          title_aliases = {"title", "headline", "newstitle", "articletitle", "newsheadline"}
          source_aliases = {"url", "articleurl", "sourceurl", "domain", "sourcedomain", "publisher", "source", "outlet", "website", "site", "host", "media"}
          label_aliases = {"label", "veracity", "truthlabel", "truthfulness", "fakenewslabel", "factuality", "isfake", "fake", "class", "reliability", "credibility"}
          fake_labels = {"fake", "fake news", "false", "misinformation", "disinformation", "false news", "not true", "untrue"}
          real_labels = {"real", "real news", "true", "factual", "credible", "reliable", "not fake", "non fake", "non-fake"}

          def norm(value):
              return re.sub(r"[^a-z0-9]+", "", str(value or "").lower())

          SHORTENERS = {"bit.ly", "t.co", "tinyurl.com", "goo.gl", "ow.ly", "is.gd", "buff.ly", "trib.al", "sptnkne.ws"}

          def domain_from(value):
              raw = str(value or "").strip()
              if not raw:
                  return None
              if "://" not in raw:
                  raw = "https://" + raw
              try:
                  host = (urlsplit(raw).hostname or "").lower().rstrip(".").encode("idna").decode("ascii")
              except (ValueError, UnicodeError):
                  return None
              if host.startswith("www."):
                  host = host[4:]
              if host in SHORTENERS or "." not in host:
                  return None
              try:
                  sld = get_sld(host, strict=True)
              except Exception:
                  sld = None
              sld = str(sld or "").lower().rstrip(".")
              return sld if sld and sld not in SHORTENERS else None

          def map_label(value):
              value = re.sub(r"\s+", " ", str(value or "").strip().lower())
              if value in fake_labels:
                  return "FAKE"
              if value in real_labels:
                  return "REAL"
              return None

          def scan_delimited(stream, delimiter, origin):
              reader = csv.DictReader(io.TextIOWrapper(stream, encoding="utf-8-sig", errors="replace", newline=""), delimiter=delimiter)
              headers = reader.fieldnames or []
              normalized = {norm(h): h for h in headers}
              body_columns = [h for h in headers if norm(h) in text_aliases]
              if not body_columns:
                  body_columns = [h for h in headers if any(term in norm(h) for term in ("articletext", "articlebody", "fulltext", "articlecontent", "newscontent"))]
              title_columns = [h for h in headers if norm(h) in title_aliases]
              source_columns = [h for h in headers if norm(h) in source_aliases or any(term in norm(h) for term in ("sourceurl", "sourcedomain", "publisherdomain", "websiteurl"))]
              label_columns = [h for h in headers if norm(h) in label_aliases or any(term in norm(h) for term in ("truthlabel", "veracitylabel", "fakelabel"))]
              result = {
                  "container_type": origin,
                  "header_columns": headers,
                  "candidate_body_columns": body_columns,
                  "candidate_title_columns": title_columns,
                  "candidate_source_columns": source_columns,
                  "candidate_label_columns": label_columns,
                  "row_count": 0,
                  "full_text_rows_300_chars_50_words": 0,
                  "full_text_with_explicit_string_binary_label": 0,
                  "full_text_with_explicit_string_binary_label_and_source": 0,
                  "source_domain_fingerprints": set(),
                  "_article_fingerprints": {},
                  "label_value_counts": {col: Counter() for col in label_columns},
                  "mapped_label_counts": {col: Counter() for col in label_columns},
              }
              for row in reader:
                  result["row_count"] += 1
                  for col in label_columns:
                      raw = str(row.get(col) or "").strip()
                      if raw:
                          result["label_value_counts"][col][re.sub(r"\s+", " ", raw.lower())[:80]] += 1
                          mapped = map_label(raw)
                          if mapped:
                              result["mapped_label_counts"][col][mapped] += 1
                  if not body_columns:
                      continue
                  body = str(row.get(body_columns[0]) or "").strip()
                  title = str(row.get(title_columns[0]) or "").strip() if title_columns else ""
                  full_text = (title + " " + body).strip()
                  if len(full_text) < 300 or len(full_text.split()) < 50:
                      continue
                  result["full_text_rows_300_chars_50_words"] += 1
                  normalized_text = re.sub(r"\s+", " ", full_text).strip().casefold()
                  text_fingerprint = hashlib.sha256(normalized_text.encode("utf-8")).hexdigest()
                  article = result["_article_fingerprints"].setdefault(
                      text_fingerprint, {"labels": set(), "sources": set()}
                  )
                  mapped_labels = set()
                  for col in label_columns:
                      mapped = map_label(row.get(col))
                      if mapped:
                          mapped_labels.add(mapped)
                  article["labels"].update(mapped_labels)
                  if mapped_labels:
                      result["full_text_with_explicit_string_binary_label"] += 1
                  source = None
                  for col in source_columns:
                      source = domain_from(row.get(col))
                      if source:
                          break
                  if source:
                      source_fingerprint = hashlib.sha256(source.encode("utf-8")).hexdigest()
                      article["sources"].add(source_fingerprint)
                      result["source_domain_fingerprints"].add(source_fingerprint)
                      if mapped_labels:
                          result["full_text_with_explicit_string_binary_label_and_source"] += 1
              result["label_value_counts"] = {col: dict(counts.most_common(40)) for col, counts in result["label_value_counts"].items()}
              result["mapped_label_counts"] = {col: dict(counts) for col, counts in result["mapped_label_counts"].items()}
              result["source_domain_fingerprints"] = sorted(result["source_domain_fingerprints"])
              return result

          report = []
          archive_member_count = 0
          with zipfile.ZipFile(archive) as outer:
              archive_member_count = len([i for i in outer.infolist() if not i.is_dir()])
              for info in outer.infolist():
                  if info.is_dir():
                      continue
                  suffix = Path(info.filename).suffix.lower()
                  if suffix not in {".csv", ".tsv"}:
                      # Do not assume other formats. Record only aggregate extension counts below.
                      continue
                  delimiter = "," if suffix == ".csv" else "\t"
                  with outer.open(info, "r") as stream:
                      item = scan_delimited(stream, delimiter, "top-level")
                      item["archive_member_extension"] = suffix
                      item["uncompressed_bytes"] = info.file_size
                      report.append(item)

          # Handle a nested ZIP without copying article rows to disk or to the report.
          nested_reports = []
          with zipfile.ZipFile(archive) as outer:
              nested_infos = [i for i in outer.infolist() if Path(i.filename).suffix.lower() == ".zip" and not i.is_dir()]
              for info in nested_infos:
                  nested_path = Path("/tmp") / ("nested-" + hashlib.sha256(info.filename.encode()).hexdigest()[:12] + ".zip")
                  with outer.open(info, "r") as src, nested_path.open("wb") as dst:
                      while True:
                          chunk = src.read(8 * 1024 * 1024)
                          if not chunk:
                              break
                          dst.write(chunk)
                  with zipfile.ZipFile(nested_path) as inner:
                      for item_info in inner.infolist():
                          if item_info.is_dir():
                              continue
                          suffix = Path(item_info.filename).suffix.lower()
                          if suffix not in {".csv", ".tsv"}:
                              continue
                          delimiter = "," if suffix == ".csv" else "\t"
                          with inner.open(item_info, "r") as stream:
                              item = scan_delimited(stream, delimiter, "nested-zip")
                              item["archive_member_extension"] = suffix
                              item["uncompressed_bytes"] = item_info.file_size
                              nested_reports.append(item)
                  nested_path.unlink(missing_ok=True)

          selected = nested_reports if nested_reports else report
          unique_articles = {}
          for item in selected:
              for article_fp, article in item["_article_fingerprints"].items():
                  combined = unique_articles.setdefault(article_fp, {"labels": set(), "sources": set()})
                  combined["labels"].update(article["labels"])
                  combined["sources"].update(article["sources"])
          unique_with_binary_label = [x for x in unique_articles.values() if x["labels"]]
          unique_with_source = [x for x in unique_with_binary_label if x["sources"]]
          unique_unambiguous_binary_with_source = [x for x in unique_with_source if len(x["labels"]) == 1]
          unique_publisher_disjoint = [
              x for x in unique_unambiguous_binary_with_source
              if not (x["sources"] & candidate_domain_fingerprints)
          ]
          unique_publisher_overlap = [
              x for x in unique_unambiguous_binary_with_source
              if x["sources"] & candidate_domain_fingerprints
          ]
          all_external_domain_fingerprints = sorted({
              fp for x in selected for fp in x["source_domain_fingerprints"]
          })
          overlap_fingerprints = sorted(set(all_external_domain_fingerprints) & candidate_domain_fingerprints)
          # Do not serialize per-article text fingerprints or any article content.
          for item in selected:
              item.pop("_article_fingerprints", None)
          aggregate = {
              "delimited_files_scanned": len(selected),
              "total_rows_across_exports_not_deduplicated": sum(x["row_count"] for x in selected),
              "full_text_rows_300_chars_50_words_across_exports_not_deduplicated": sum(x["full_text_rows_300_chars_50_words"] for x in selected),
              "full_text_with_explicit_string_binary_label_across_exports_not_deduplicated": sum(x["full_text_with_explicit_string_binary_label"] for x in selected),
              "full_text_with_explicit_string_binary_label_and_source_across_exports_not_deduplicated": sum(x["full_text_with_explicit_string_binary_label_and_source"] for x in selected),
              "unique_full_text_article_fingerprints": len(unique_articles),
              "unique_full_text_with_explicit_binary_label": len(unique_with_binary_label),
              "unique_full_text_with_unambiguous_binary_label_and_source": len(unique_unambiguous_binary_with_source),
              "unique_full_text_with_unambiguous_binary_label_and_source_disjoint_from_candidate_development_publishers": len(unique_publisher_disjoint),
              "unique_full_text_with_unambiguous_binary_label_and_source_overlapping_candidate_development_publishers": len(unique_publisher_overlap),
              "unique_full_text_with_conflicting_binary_labels": sum(1 for x in unique_articles.values() if len(x["labels"]) > 1),
              "candidate_development_publisher_count": len(candidate_domain_fingerprints),
              "external_eligible_article_publisher_count": len(all_external_domain_fingerprints),
              "overlapping_publisher_count": len(overlap_fingerprints),
              "overlapping_publisher_fingerprints_sha256": hashlib.sha256(json.dumps(overlap_fingerprints, separators=(",", ":")).encode()).hexdigest(),
              "candidate_model_version": expected_model_version,
              "candidate_artifact_sha256": expected_artifact_sha256,
              "candidate_training_archive_sha256": candidate_dataset_sha256,
              "candidate_fingerprint_source_run_id": 40112758824,
              "source_domain_fingerprint_algorithm": "SHA-256 of canonical registrable domain UTF-8; unsalted equality fingerprint, not anonymization",
              "text_deduplication_algorithm": "SHA-256 of case-folded full text with all Unicode whitespace collapsed; only counts are emitted",
              "release_screening_gate_passed": len(unique_publisher_disjoint) >= 10000 and len(overlap_fingerprints) == 0,
              "rows_with_unmapped_labels_not_guessed": "Only explicit strings for binary FAKE/REAL are mapped; numeric and ambiguous labels are not guessed"
          }
          with archive.open("rb") as archive_stream:
              archive_sha256 = hashlib.file_digest(archive_stream, "sha256").hexdigest()
          output = {
              "dataset": "Disinformation Detection: Code and Datasets v1.1",
              "doi": "10.5281/zenodo.18135595",
              "license": "CC BY 4.0",
              "archive_md5_expected": "64b4e8888f95ec104611de9d01ffe903",
              "archive_sha256": archive_sha256,
              "archive_bytes": archive.stat().st_size,
              "archive_member_count": archive_member_count,
              "top_level_delimited_files": report,
              "nested_delimited_files": nested_reports,
              "aggregate": aggregate,
              "candidate_model": {
                  "model_version": expected_model_version,
                  "artifact_sha256": expected_artifact_sha256,
                  "training_archive_sha256": candidate_dataset_sha256,
                  "source_run_id": 40112758824
              },
              "notes": [
                  "Structural/schema audit only; no article body, title, URL, domain or per-article fingerprint is emitted.",
                  "Only explicit string values for binary FAKE/REAL are mapped. Numeric and ambiguous labels are not guessed.",
                  "All aggregate row counts across multiple CSV exports are marked not deduplicated; release screening uses unique text fingerprints.",
                  "Publisher overlap is checked against the candidate's pinned development publisher set; overlapping publishers are not independent external evidence.",
                  "Text deduplication fingerprints are internal to the audit and not emitted; source-domain fingerprints are unsalted SHA-256 equality fingerprints, not anonymization."
              ],
              "release_gate_passed": False
          }
          out = Path("artifacts/external-corpus-audit/disinformation-v1.1-audit.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"archive_bytes": output["archive_bytes"], "archive_member_count": archive_member_count, "aggregate": aggregate, "file_summaries": [{"container_type":x["container_type"],"columns":x["header_columns"],"row_count":x["row_count"],"candidate_body_columns":x["candidate_body_columns"],"candidate_label_columns":x["candidate_label_columns"],"candidate_source_columns":x["candidate_source_columns"],"rows_with_full_text_explicit_string_binary_label_and_source":x["full_text_with_explicit_string_binary_label_and_source"],"label_value_counts":x["label_value_counts"]} for x in selected], "release_gate_passed": False}, indent=2))
          PY

      - name: Upload aggregate audit only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-disinformation-corpus-audit
          path: artifacts/external-corpus-audit/disinformation-v1.1-audit.json
          if-no-files-found: warn
          retention-days: 30
