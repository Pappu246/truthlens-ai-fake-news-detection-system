name: Independent External Dataset Audit (Zenodo v1.1)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/disinformation-external-corpus-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truthlens-disinformation-corpus-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit the CC BY 4.0 disinformation datasets archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"

      - name: Fetch and verify official Zenodo record metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --connect-timeout 20 --max-time 60 \
            "https://zenodo.org/api/records/18135595" -o /tmp/zenodo-record.json
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("/tmp/zenodo-record.json").read_text())
          assert record.get("id") == 18135595, record.get("id")
          files = record.get("files", [])
          matches = [item for item in files if "datasets" in item.get("key", "").lower()]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one dataset ZIP in the published Zenodo record.")
          item = matches[0]
          checksum = item.get("checksum", "")
          if checksum.startswith("md5:"):
              checksum = checksum[4:]
          expected = "64b4e8888f95ec104611de9d01ffe903"
          if checksum.lower() != expected:
              raise SystemExit(f"Zenodo file checksum changed; expected {expected}, got {checksum}")
          metadata = record.get("metadata", {})
          license_id = ((metadata.get("license") or {}).get("id") or "").lower()
          if "cc-by-4.0" not in license_id and "cc by 4.0" not in license_id:
              raise SystemExit(f"Unexpected/missing dataset license metadata: {license_id!r}")
          Path("/tmp/zenodo-dataset-url.txt").write_text(item["links"]["self"], encoding="utf-8")
          print(json.dumps({
              "record_id": record["id"],
              "doi": metadata.get("doi"),
              "title": metadata.get("title"),
              "license_id": license_id,
              "file_size": item.get("size"),
              "checksum": "md5:" + checksum,
              "file_url_resolved_from_official_record": True
          }, indent=2))
          PY

      - name: Download and hash-check the dataset archive
        shell: bash
        run: |
          set -euo pipefail
          FILE_URL="$(cat /tmp/zenodo-dataset-url.txt)"
          curl --fail --location --show-error --connect-timeout 20 --max-time 900 \
            --retry 2 --retry-all-errors --retry-delay 3 \
            "$FILE_URL" -o /tmp/zenodo-datasets.zip
          printf "%s  %s\n" "64b4e8888f95ec104611de9d01ffe903" /tmp/zenodo-datasets.zip | md5sum --check -

      - name: Stream-audit external article schema and eligible source-labelled text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/external-corpus-audit
          python - <<'PY'
          import csv, hashlib, io, json, re, zipfile
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit
          from publicsuffix2 import get_sld

          archive = Path("/tmp/zenodo-datasets.zip")
          text_aliases = {"articletext", "fulltext", "fullarticle", "articlebody", "body", "content", "text", "newscontent", "articlecontent"}
          title_aliases = {"title", "headline", "newstitle", "articletitle", "newsheadline"}
          source_aliases = {"url", "articleurl", "sourceurl", "domain", "sourcedomain", "publisher", "source", "outlet", "website", "site", "host", "media"}
          label_aliases = {"label", "veracity", "truthlabel", "truthfulness", "fakenewslabel", "factuality", "isfake", "fake", "class", "reliability", "credibility"}
          fake_labels = {"fake", "fake news", "false", "misinformation", "disinformation", "false news", "not true", "untrue"}
          real_labels = {"real", "real news", "true", "factual", "credible", "reliable", "not fake", "non fake", "non-fake"}

          def norm(value):
              return re.sub(r"[^a-z0-9]+", "", str(value or "").lower())

          def domain_from(value):
              value = str(value or "").strip()
              if not value:
                  return None
              if "://" not in value:
                  value = "https://" + value
              try:
                  host = (urlsplit(value).hostname or "").lower().rstrip(".")
                  if host.startswith("www."):
                      host = host[4:]
                  if not host:
                      return None
                  sld = get_sld(host, strict=True)
                  return str(sld).lower() if sld else None
              except Exception:
                  return None

          def map_label(value):
              value = re.sub(r"\s+", " ", str(value or "").strip().lower())
              if value in fake_labels:
                  return "FAKE"
              if value in real_labels:
                  return "REAL"
              return None

          def scan_delimited(stream, delimiter, origin):
              reader = csv.DictReader(io.TextIOWrapper(stream, encoding="utf-8-sig", errors="replace", newline=""), delimiter=delimiter)
              headers = reader.fieldnames or []
              normalized = {norm(h): h for h in headers}
              body_columns = [h for h in headers if norm(h) in text_aliases]
              if not body_columns:
                  body_columns = [h for h in headers if any(term in norm(h) for term in ("articletext", "articlebody", "fulltext", "articlecontent", "newscontent"))]
              title_columns = [h for h in headers if norm(h) in title_aliases]
              source_columns = [h for h in headers if norm(h) in source_aliases or any(term in norm(h) for term in ("sourceurl", "sourcedomain", "publisherdomain", "websiteurl"))]
              label_columns = [h for h in headers if norm(h) in label_aliases or any(term in norm(h) for term in ("truthlabel", "veracitylabel", "fakelabel"))]
              result = {
                  "container_type": origin,
                  "header_columns": headers,
                  "candidate_body_columns": body_columns,
                  "candidate_title_columns": title_columns,
                  "candidate_source_columns": source_columns,
                  "candidate_label_columns": label_columns,
                  "row_count": 0,
                  "full_text_rows_300_chars_50_words": 0,
                  "full_text_with_explicit_string_binary_label": 0,
                  "full_text_with_explicit_string_binary_label_and_source": 0,
                  "label_value_counts": {col: Counter() for col in label_columns},
                  "mapped_label_counts": {col: Counter() for col in label_columns},
              }
              for row in reader:
                  result["row_count"] += 1
                  for col in label_columns:
                      raw = str(row.get(col) or "").strip()
                      if raw:
                          result["label_value_counts"][col][re.sub(r"\s+", " ", raw.lower())[:80]] += 1
                          mapped = map_label(raw)
                          if mapped:
                              result["mapped_label_counts"][col][mapped] += 1
                  if not body_columns:
                      continue
                  body = str(row.get(body_columns[0]) or "").strip()
                  title = str(row.get(title_columns[0]) or "").strip() if title_columns else ""
                  full_text = (title + " " + body).strip()
                  if len(full_text) < 300 or len(full_text.split()) < 50:
                      continue
                  result["full_text_rows_300_chars_50_words"] += 1
                  mapped_label = None
                  if label_columns:
                      for col in label_columns:
                          mapped_label = map_label(row.get(col))
                          if mapped_label:
                              break
                  if not mapped_label:
                      continue
                  result["full_text_with_explicit_string_binary_label"] += 1
                  source = next((domain_from(row.get(col)) for col in source_columns if domain_from(row.get(col))), None)
                  if source:
                      result["full_text_with_explicit_string_binary_label_and_source"] += 1
              result["label_value_counts"] = {col: dict(counts.most_common(40)) for col, counts in result["label_value_counts"].items()}
              result["mapped_label_counts"] = {col: dict(counts) for col, counts in result["mapped_label_counts"].items()}
              return result

          report = []
          archive_member_count = 0
          with zipfile.ZipFile(archive) as outer:
              archive_member_count = len([i for i in outer.infolist() if not i.is_dir()])
              for info in outer.infolist():
                  if info.is_dir():
                      continue
                  suffix = Path(info.filename).suffix.lower()
                  if suffix not in {".csv", ".tsv"}:
                      # Do not assume other formats. Record only aggregate extension counts below.
                      continue
                  delimiter = "," if suffix == ".csv" else "\t"
                  with outer.open(info, "r") as stream:
                      item = scan_delimited(stream, delimiter, "top-level")
                      item["archive_member_extension"] = suffix
                      item["uncompressed_bytes"] = info.file_size
                      report.append(item)

          # Handle a nested ZIP without copying article rows to disk or to the report.
          nested_reports = []
          with zipfile.ZipFile(archive) as outer:
              nested_infos = [i for i in outer.infolist() if Path(i.filename).suffix.lower() == ".zip" and not i.is_dir()]
              for info in nested_infos:
                  nested_path = Path("/tmp") / ("nested-" + hashlib.sha256(info.filename.encode()).hexdigest()[:12] + ".zip")
                  with outer.open(info, "r") as src, nested_path.open("wb") as dst:
                      while True:
                          chunk = src.read(8 * 1024 * 1024)
                          if not chunk:
                              break
                          dst.write(chunk)
                  with zipfile.ZipFile(nested_path) as inner:
                      for item_info in inner.infolist():
                          if item_info.is_dir():
                              continue
                          suffix = Path(item_info.filename).suffix.lower()
                          if suffix not in {".csv", ".tsv"}:
                              continue
                          delimiter = "," if suffix == ".csv" else "\t"
                          with inner.open(item_info, "r") as stream:
                              item = scan_delimited(stream, delimiter, "nested-zip")
                              item["archive_member_extension"] = suffix
                              item["uncompressed_bytes"] = item_info.file_size
                              nested_reports.append(item)
                  nested_path.unlink(missing_ok=True)

          selected = report if report else nested_reports
          aggregate = {
              "delimited_files_scanned": len(selected),
              "total_rows": sum(x["row_count"] for x in selected),
              "full_text_rows_300_chars_50_words": sum(x["full_text_rows_300_chars_50_words"] for x in selected),
              "full_text_with_explicit_string_binary_label": sum(x["full_text_with_explicit_string_binary_label"] for x in selected),
              "full_text_with_explicit_string_binary_label_and_source": sum(x["full_text_with_explicit_string_binary_label_and_source"] for x in selected),
              "rows_with_unmapped_labels_not_guessed": "counted by per-column distribution only; numeric/ambiguous labels not mapped"
          }
          output = {
              "dataset": "Disinformation Detection: Code and Datasets v1.1",
              "doi": "10.5281/zenodo.18135595",
              "license": "CC BY 4.0",
              "archive_md5_expected": "64b4e8888f95ec104611de9d01ffe903",
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "archive_bytes": archive.stat().st_size,
              "archive_member_count": archive_member_count,
              "top_level_delimited_files": report,
              "nested_delimited_files": nested_reports,
              "aggregate": aggregate,
              "notes": [
                  "Structural/schema audit only; no article body, title, URL, domain or individual row is emitted.",
                  "Only explicit string values for binary FAKE/REAL are mapped. Numeric and ambiguous labels are not guessed.",
                  "A large row count does not prove independent publishers or valid item-level ground truth.",
                  "External performance evaluation must remain blocked until text/source overlap against candidate-fitting corpora is checked."
              ],
              "release_gate_passed": False
          }
          out = Path("artifacts/external-corpus-audit/disinformation-v1.1-audit.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"archive_bytes": output["archive_bytes"], "archive_member_count": archive_member_count, "aggregate": aggregate, "file_summaries": [{"container_type":x["container_type"],"columns":x["header_columns"],"row_count":x["row_count"],"candidate_body_columns":x["candidate_body_columns"],"candidate_label_columns":x["candidate_label_columns"],"candidate_source_columns":x["candidate_source_columns"],"rows_with_full_text_explicit_string_binary_label_and_source":x["full_text_with_explicit_string_binary_label_and_source"],"label_value_counts":x["label_value_counts"]} for x in selected], "release_gate_passed": False}, indent=2))
          PY

      - name: Upload aggregate audit only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-disinformation-corpus-audit
          path: artifacts/external-corpus-audit/disinformation-v1.1-audit.json
          if-no-files-found: warn
          retention-days: 30
