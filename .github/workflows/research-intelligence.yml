name: TruthLens Research Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0"

permissions:
  contents: read

jobs:
  scan:
    name: Discover research and benchmark changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Run research intelligence scan
        run: node scripts/researchIntelligence.mjs
        env:
          RESEARCH_INTELLIGENCE_OUT: research-intelligence-output

      - name: Upload research intelligence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-research-intelligence-${{ github.run_number }}
          path: research-intelligence-output/
          if-no-files-found: error
          retention-days: 30
