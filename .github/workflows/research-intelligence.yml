name: TruthLens Research Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0"

permissions:
  contents: read

jobs:
  scan:
    name: Discover research and benchmark changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run research intelligence scan
        run: node scripts/researchIntelligence.mjs
        env:
          RESEARCH_INTELLIGENCE_OUT: research-intelligence-output

      - name: Upload research intelligence artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: truthlens-research-intelligence-${{ github.run_number }}
          path: research-intelligence-output/
          if-no-files-found: error
          retention-days: 30
