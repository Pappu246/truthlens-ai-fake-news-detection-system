name: Runtime Model Candidate Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/train_isot_runtime_candidate.py"
      - "scripts/runtimeModelParityTests.ts"
      - "scripts/runtimeCandidateSafetyTests.ts"
      - "scripts/evaluate_welfake_candidate.py"
      - "scripts/test_evaluate_welfake_candidate.py"
      - "scripts/isot_data_pipeline.py"
      - "server/mlEngine.ts"
      - "package.json"
      - "requirements-model.txt"
      - ".github/workflows/runtime-model-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truthlens-runtime-model-candidate
  cancel-in-progress: true

jobs:
  polyglot_dataset_probe:
    name: Download independent PolyglotFakeFacts v2.0 archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and inspect the official CC BY 4.0 dataset archive
        run: |
          set -euo pipefail
          mkdir -p artifacts/independent-data
          DATASET_URL="https://data.mendeley.com/public-api/zip/8yfrm6z9dx/download/1"
          curl --fail --location --show-error --connect-timeout 20 --max-time 600 --retry 2 --retry-all-errors --retry-delay 3 \
            --user-agent "TruthLens-Independent-Model-Validation/1.0" \
            "$DATASET_URL" -o artifacts/independent-data/polyglotfakefacts-v2.zip
          test -s artifacts/independent-data/polyglotfakefacts-v2.zip
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          archive = Path("artifacts/independent-data/polyglotfakefacts-v2.zip")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt dataset ZIP entry: {bad}")
              entries = zf.infolist()
          names = {Path(entry.filename).name.lower(): entry for entry in entries if not entry.is_dir()}
          required = ("fake.xlsx", "real.xlsx")
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"Published archive is missing required full-article workbooks: {missing}; found {sorted(names)[:40]}")
          summary = {
              "dataset": "PolyglotFakeFacts v2.0",
              "doi": "10.17632/8yfrm6z9dx.1",
              "license": "CC BY 4.0",
              "archive": str(archive),
              "archive_bytes": archive.stat().st_size,
              "archive_sha256": digest,
              "required_workbooks": {
                  name: {"member": names[name].filename, "bytes": names[name].file_size}
                  for name in required
              },
              "zip_integrity_check": "passed",
          }
          print(json.dumps(summary, indent=2))
          Path("artifacts/independent-data/archive-metadata.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload immutable source archive and fingerprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polyglotfakefacts-v2-independent-source
          path: |
            artifacts/independent-data/polyglotfakefacts-v2.zip
            artifacts/independent-data/archive-metadata.json
          if-no-files-found: error
          compression-level: 0

  candidate:
    name: Build and validate exact runtime candidate
    needs: polyglot_dataset_probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"

      - name: Install pinned Python ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-model.txt

      - name: Download and verify official ISOT release assets
        env:
          FAKE_URL: https://github.com/Pappu246/truthlens-ai-fake-news-detection-system/releases/download/isot-data-v1/Fake.csv
          REAL_URL: https://github.com/Pappu246/truthlens-ai-fake-news-detection-system/releases/download/isot-data-v1/True.csv
          FAKE_SHA256: bebf8bcfe95678bf2c732bf413a2ce5f621af0102c82bf08083b2e5d3c693d0c
          REAL_SHA256: ba0844414a65dc6ae7402b8eee5306da24b6b56488d6767135af466c7dcb2775
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$FAKE_URL" -o data/Fake.csv
          curl --fail --location --retry 3 --retry-delay 2 "$REAL_URL" -o data/True.csv
          echo "$FAKE_SHA256  data/Fake.csv" | sha256sum --check -
          echo "$REAL_SHA256  data/True.csv" | sha256sum --check -

      - name: Install model-governance test runner
        run: python -m pip install pytest

      - name: Verify model promotion governance and attribution-ablation contracts
        run: python -m pytest backend/tests/test_phase9_model_governance.py scripts/test_evaluate_welfake_candidate.py scripts/test_evaluate_polyglot_independent_candidate.py -q

      - name: Rebuild verified Phase 2 splits
        run: python scripts/isot_data_pipeline.py

      - name: Download and verify WELFake training source (never score its exposed holdout)
        timeout-minutes: 8
        env:
          WELFAKE_URL: https://zenodo.org/records/4561253/files/WELFake_Dataset.csv?download=1
          WELFAKE_MD5: 73c9675a4b3d09f86a6933d0b8d7d908
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --show-error --connect-timeout 20 --max-time 360 --retry 2 --retry-all-errors --retry-delay 2 "$WELFAKE_URL" -o data/WELFake_Dataset.csv
          test -s data/WELFake_Dataset.csv
          ls -lh data/WELFake_Dataset.csv
          printf "%s  %s\\n" "$WELFAKE_MD5" "data/WELFake_Dataset.csv" | md5sum --check -

      - name: Snapshot canonical production artifact before candidate training
        run: cp data/saved_model_artifacts.json /tmp/truthlens-production-artifact.before.json

      - name: Train exact compact runtime candidate
        run: python scripts/train_isot_runtime_candidate.py --max-features 32000 --min-df 1 --welfake data/WELFake_Dataset.csv

      - name: Enforce internal frozen-policy gate before external scoring
        id: internal_policy_gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, hashlib, json, os
          from pathlib import Path

          paths = sorted(glob.glob("artifacts/models/*/model_artifact.json"))
          failures = []
          selection = {}
          artifact_sha = None
          if len(paths) != 1:
              failures.append(f"Expected exactly one freshly trained candidate artifact, found {len(paths)}.")
          else:
              artifact_path = Path(paths[0])
              manifest_path = artifact_path.parent / "manifest.json"
              if not manifest_path.is_file():
                  failures.append("Fresh candidate manifest is missing.")
              else:
                  artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  artifact_sha = hashlib.sha256(artifact_path.read_bytes()).hexdigest()
                  if artifact_sha != manifest.get("artifact_sha256"):
                      failures.append("Candidate artifact SHA-256 does not match its manifest.")
                  if manifest.get("production_eligible") is not False or manifest.get("promotion_status") != "CANDIDATE_ONLY":
                      failures.append("Candidate manifest must remain non-promotable.")
                  thresholds = artifact.get("thresholds", {})
                  if thresholds.get("fake_threshold") != 0.98 or thresholds.get("real_threshold") != 0.35:
                      failures.append("Candidate changed the frozen 0.98/0.35 production thresholds.")
                  selection = artifact.get("metrics", {}).get("frozen_runtime_policy_model_selection", {}).get("selection_metrics", {})
                  if selection.get("passed") is not True:
                      failures.append("Internal validation did not pass the frozen runtime-policy gate.")
                  if selection.get("coverage", 0) < 0.50:
                      failures.append("Internal validation coverage is below 0.50.")
                  if selection.get("operational_balanced_accuracy_abstentions_count_as_not_correct", 0) < 0.70:
                      failures.append("Internal operational balanced accuracy is below 0.70.")
                  if selection.get("fake_recall_all_fake_samples", 0) < 0.70:
                      failures.append("Internal FAKE recall is below 0.70.")
                  if selection.get("real_recall_all_real_samples", 0) < 0.70:
                      failures.append("Internal REAL recall is below 0.70.")

          passed = len(failures) == 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"passed={'true' if passed else 'false'}\n")
          result = {
              "internal_frozen_policy_gate_passed": passed,
              "candidate_artifact": paths[0] if len(paths) == 1 else None,
              "candidate_artifact_sha256": artifact_sha,
              "selection_metrics": selection,
              "failures": failures,
              "external_holdout_action": "ELIGIBLE_TO_SCORE" if passed else "SKIP_EXTERNAL_SCORING",
          }
          print(json.dumps(result, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Internal candidate quality gate before external scoring\n\n")
              summary.write(f"- Gate passed: **{passed}**\n")
              summary.write(f"- External holdout: **{'may be scored' if passed else 'will not be scored'}**\n")
              for failure in failures:
                  summary.write(f"- BLOCKED: {failure}\n")
          PY

      - name: Download the independent dataset artifact from the probe job
        if: steps.internal_policy_gate.outputs.passed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: polyglotfakefacts-v2-independent-source
          path: artifacts/independent-data

      - name: Extract and inspect independent article workbooks
        if: steps.internal_policy_gate.outputs.passed == 'true'
        run: |
          set -euo pipefail
          python -m pip install openpyxl==3.1.5
          mkdir -p /tmp/truthlens-polyglot
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          archive = Path("artifacts/independent-data/polyglotfakefacts-v2.zip")
          out = Path("/tmp/truthlens-polyglot")
          with zipfile.ZipFile(archive) as zf:
              members = [m for m in zf.infolist() if not m.is_dir() and Path(m.filename).name.lower() in {"fake.xlsx", "real.xlsx"}]
              if {Path(m.filename).name.lower() for m in members} != {"fake.xlsx", "real.xlsx"}:
                  raise SystemExit("Required Fake.xlsx and Real.xlsx workbooks not found after archive download.")
              for member in members:
                  target = out / Path(member.filename).name
                  target.write_bytes(zf.read(member))
          print(json.dumps({
              "dataset_dir": str(out),
              "workbooks": [{"name": p.name, "bytes": p.stat().st_size} for p in sorted(out.glob("*.xlsx"))]
          }, indent=2))
          PY

      - name: Evaluate candidate on fresh independent full-article dataset
        if: steps.internal_policy_gate.outputs.passed == 'true'
        continue-on-error: true
        env:
          POLYGLOT_EXPECTED_ARCHIVE_SHA256: "06762bfccc55c3236e51bab2d8907218c4c2705e84e3932a5587d29f9879016e"
        run: |
          set -euo pipefail
          CANDIDATE_ARTIFACT="$(find artifacts/models -type f -name model_artifact.json -print -quit)"
          test -n "$CANDIDATE_ARTIFACT"
          CANDIDATE_DIR="$(dirname "$CANDIDATE_ARTIFACT")"
          python scripts/evaluate_polyglot_independent_candidate.py \
            --candidate-dir "$CANDIDATE_DIR" \
            --dataset-dir /tmp/truthlens-polyglot \
            --archive artifacts/independent-data/polyglotfakefacts-v2.zip \
            --welfake data/WELFake_Dataset.csv \
            --expected-archive-sha256 "$POLYGLOT_EXPECTED_ARCHIVE_SHA256"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Runtime artifact Python-to-Node parity
        run: npm run test:runtime-model-parity

      - name: Candidate-specific real/fake safety regression
        # Preserve diagnostics and run the artifact-integrity + final gate steps
        # even when candidate safety assertions fail. The final gate will still
        # fail closed because runtime_safety_validation.json records passed=false.
        continue-on-error: true
        run: |
          set -euo pipefail
          CANDIDATE_ARTIFACT="$(find artifacts/models -type f -name model_artifact.json -print -quit)"
          test -n "$CANDIDATE_ARTIFACT"
          npx tsx scripts/runtimeCandidateSafetyTests.ts "$CANDIDATE_ARTIFACT"

      - name: Existing article model safety regression
        run: npm run test:model-safety

      - name: Existing verdict regression
        run: npm run test:verdicts

      - name: Verify canonical production artifact was not modified
        run: cmp /tmp/truthlens-production-artifact.before.json data/saved_model_artifacts.json

      - name: Enforce independent full-article quality gate; keep promotion separate
        env:
          INTERNAL_POLICY_GATE_PASSED: ${{ steps.internal_policy_gate.outputs.passed }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, hashlib, json, os, sys
          paths = sorted(glob.glob("artifacts/models/*/article_independent_validation.json"))
          if not paths:
              internal_passed = os.environ.get("INTERNAL_POLICY_GATE_PASSED") == "true"
              if internal_passed:
                  reason = "The internal policy gate passed, but the external evaluator did not produce a report. Inspect the evaluator step logs."
              else:
                  reason = "The internal frozen-policy quality gate failed, so external scoring was intentionally skipped."
              message = "BLOCKED: independent full-article report is missing. " + reason
              print(message)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Independent full-article release decision\n\n")
                  summary.write("- **BLOCKED:** " + reason + "\n")
              sys.exit(1)
          report_path = paths[-1]
          candidate_dir = os.path.dirname(report_path)
          with open(report_path, encoding="utf-8") as f:
              report = json.load(f)
          artifact_path = os.path.join(candidate_dir, "model_artifact.json")
          manifest_path = os.path.join(candidate_dir, "manifest.json")
          safety_path = os.path.join(candidate_dir, "runtime_safety_validation.json")
          if not all(os.path.isfile(p) for p in (artifact_path, manifest_path, safety_path)):
              print("BLOCKED: candidate artifact, manifest, or artifact-bound safety report is missing.")
              sys.exit(1)
          artifact_sha = hashlib.sha256(open(artifact_path, "rb").read()).hexdigest()
          with open(manifest_path, encoding="utf-8") as f:
              manifest = json.load(f)
          with open(safety_path, encoding="utf-8") as f:
              safety = json.load(f)
          dataset = report.get("dataset", {})
          metrics = report.get("metrics_at_probability_threshold_0_50_diagnostic_only", {})
          policy = report.get("frozen_runtime_decision_policy", {})
          # The evaluator writes the frozen runtime-policy metrics at the top level.
          policy_checks = policy
          source_independence = report.get("source_independence", {})
          internal_gate = report.get("release_gate", {}).get("checks", {})
          training_contract = manifest.get("training_contract", {})
          expected_safety_policy = {
              "id": "sensational-conflict-abstention-v1",
              "action": "abstain_and_withhold_probabilities",
              "applies_only_when_model_probability_leans_real": True,
              "minimum_sensational_terms": 3,
              "minimum_sensational_terms_with_certainty": 2,
              "minimum_certainty_terms": 1,
              "production_status": "RESEARCH_ONLY_NOT_DEPLOYED",
          }
          checks = {
              "internal_frozen_runtime_policy_gate_passed": os.environ.get("INTERNAL_POLICY_GATE_PASSED") == "true",
              "report_completed": report.get("status") == "COMPLETED",
              "dataset_doi_and_license_are_expected": dataset.get("doi") == "10.17632/8yfrm6z9dx.1" and dataset.get("license") == "CC BY 4.0",
              "independent_archive_sha256_is_pinned_and_matches": dataset.get("archive_hash_pinned_and_matches") is True and bool(dataset.get("expected_archive_sha256")),
              "publisher_level_source_independence_is_proven": source_independence.get("proven_disjoint") is True and source_independence.get("status") == "PROVEN",
              "candidate_artifact_hash_matches_report_and_manifest": report.get("candidate", {}).get("artifact_sha256") == artifact_sha == manifest.get("artifact_sha256"),
              "eligible_independent_full_articles_at_least_10000": report.get("sample_flow", {}).get("final_eligible_samples", 0) >= 10000,
              "raw_balanced_accuracy": metrics.get("balanced_accuracy", 0) >= 0.70,
              "raw_fake_recall": metrics.get("fake_recall", 0) >= 0.70,
              "raw_real_recall": metrics.get("real_recall", 0) >= 0.70,
              "runtime_policy_coverage": policy_checks.get("coverage", 0) >= 0.50,
              "runtime_policy_operational_balanced_accuracy": policy_checks.get("operational_balanced_accuracy_abstentions_count_as_not_correct", 0) >= 0.70,
              "runtime_policy_fake_recall": policy_checks.get("fake_recall_all_fake_samples", 0) >= 0.70,
              "runtime_policy_real_recall": policy_checks.get("real_recall_all_real_samples", 0) >= 0.70,
              "independent_evaluator_all_gates_pass": report.get("release_gate", {}).get("passed") is True and all(internal_gate.values()),
              "runtime_safety_report_is_artifact_bound_and_passed": safety.get("status") == "COMPLETED" and safety.get("passed") is True and safety.get("candidate_artifact_sha256") == artifact_sha and safety.get("assertions_failed") == 0,
              "frozen_production_thresholds_unchanged": artifact_path and json.load(open(artifact_path, encoding="utf-8")).get("thresholds", {}).get("fake_threshold") == 0.98 and json.load(open(artifact_path, encoding="utf-8")).get("thresholds", {}).get("real_threshold") == 0.35,
              "candidate_safety_policy_is_explicit_and_research_only": training_contract.get("candidate_safety_policy") == expected_safety_policy and training_contract.get("candidate_safety_policy", {}).get("production_status") == "RESEARCH_ONLY_NOT_DEPLOYED",
              "candidate_manifest_remains_non_promotable": manifest.get("production_eligible") is False and manifest.get("promotion_status") == "CANDIDATE_ONLY",
          }
          print(json.dumps({
              "independent_report": report_path,
              "source_independence": source_independence,
              "dataset": {
                  "doi": dataset.get("doi"),
                  "archive_sha256": dataset.get("archive_sha256"),
                  "expected_archive_sha256": dataset.get("expected_archive_sha256"),
                  "eligible_samples": report.get("sample_flow", {}).get("final_eligible_samples"),
                  "fake_samples": report.get("sample_flow", {}).get("fake_samples"),
                  "real_samples": report.get("sample_flow", {}).get("real_samples"),
                  "overlap_removal": report.get("deduplication_and_overlap"),
              },
              "raw_metrics_at_0_50": metrics,
              "frozen_runtime_policy": policy,
              "language_subgroups": report.get("language_subgroups_at_probability_threshold_0_50_diagnostic_only"),
              "candidate_artifact_sha256": artifact_sha,
              "safety_report": safety,
              "checks": checks,
              "model_release_decision": "BLOCKED" if not all(checks.values()) else "QUALITY_GATES_PASSED_REVIEW_REQUIRED",
          }, indent=2))
          summary = [
              "## Independent full-article candidate validation — no automatic promotion",
              "",
              f"- Dataset: {dataset.get('name')} ({dataset.get('doi')})",
              f"- Internal frozen-policy quality gate passed: {os.environ.get('INTERNAL_POLICY_GATE_PASSED') == 'true'}",
              f"- Immutable archive SHA-256: {dataset.get('archive_sha256')}",
              f"- Eligible independent full articles: {report.get('sample_flow', {}).get('final_eligible_samples')}",
              f"- Raw balanced accuracy: {metrics.get('balanced_accuracy')}",
              f"- Raw fake recall: {metrics.get('fake_recall')}",
              f"- Raw real recall: {metrics.get('real_recall')}",
              f"- Frozen-policy coverage: {policy_checks.get('coverage')}",
              f"- Frozen-policy operational balanced accuracy: {policy_checks.get('operational_balanced_accuracy_abstentions_count_as_not_correct')}",
              f"- Frozen-policy fake recall: {policy_checks.get('fake_recall_all_fake_samples')}",
              f"- Frozen-policy real recall: {policy_checks.get('real_recall_all_real_samples')}",
              "",
              "### Release gates"
          ]
          summary += [f"- {'PASS' if ok else 'BLOCKED'}: {name}" for name, ok in checks.items()]
          summary += [
              "",
              "WELFake's previously examined holdout is not used in this gate and must not be reused to select candidate variants.",
              "Even if every numeric gate passes, this candidate remains CANDIDATE_ONLY pending independent human review and the remaining benchmark protocol."
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")
          if not all(checks.values()):
              print("BLOCKED: do not promote this candidate.")
              sys.exit(1)
          PY

      - name: Upload runtime candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-runtime-model-candidate
          path: |
            artifacts/models/**
            data/isot_prepared/stats.json
          if-no-files-found: warn
