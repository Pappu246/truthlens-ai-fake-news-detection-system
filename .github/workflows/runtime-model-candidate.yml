name: Runtime Model Candidate Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/train_isot_runtime_candidate.py"
      - "scripts/runtimeModelParityTests.ts"
      - "scripts/runtimeCandidateSafetyTests.ts"
      - "scripts/evaluate_welfake_candidate.py"
      - "scripts/isot_data_pipeline.py"
      - "server/mlEngine.ts"
      - "package.json"
      - "requirements-model.txt"
      - ".github/workflows/runtime-model-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build and validate exact runtime candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"

      - name: Install pinned Python ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-model.txt

      - name: Download and verify official ISOT release assets
        env:
          FAKE_URL: https://github.com/Pappu246/truthlens-ai-fake-news-detection-system/releases/download/isot-data-v1/Fake.csv
          REAL_URL: https://github.com/Pappu246/truthlens-ai-fake-news-detection-system/releases/download/isot-data-v1/True.csv
          FAKE_SHA256: bebf8bcfe95678bf2c732bf413a2ce5f621af0102c82bf08083b2e5d3c693d0c
          REAL_SHA256: ba0844414a65dc6ae7402b8eee5306da24b6b56488d6767135af466c7dcb2775
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$FAKE_URL" -o data/Fake.csv
          curl --fail --location --retry 3 --retry-delay 2 "$REAL_URL" -o data/True.csv
          echo "$FAKE_SHA256  data/Fake.csv" | sha256sum --check -
          echo "$REAL_SHA256  data/True.csv" | sha256sum --check -

      - name: Install model-governance test runner
        run: python -m pip install pytest

      - name: Verify model promotion governance contracts
        run: python -m pytest backend/tests/test_phase9_model_governance.py -q

      - name: Rebuild verified Phase 2 splits
        run: python scripts/isot_data_pipeline.py

      - name: Snapshot canonical production artifact before candidate training
        run: cp data/saved_model_artifacts.json /tmp/truthlens-production-artifact.before.json

      - name: Train exact compact runtime candidate
        run: python scripts/train_isot_runtime_candidate.py

      - name: Download and verify WELFake full-article external evaluation corpus
        env:
          WELFAKE_URL: https://zenodo.org/records/4561253/files/WELFake_Dataset.csv?download=1
          WELFAKE_MD5: 73c9675a4b3d09f86a6933d0b8d7d908
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --retry 3 --retry-delay 2 "$WELFAKE_URL" -o data/WELFake_Dataset.csv
          printf "%s  %s\\n" "$WELFAKE_MD5" "data/WELFake_Dataset.csv" | md5sum --check -

      - name: Evaluate candidate on WELFake full-article OOD benchmark
        run: |
          set -euo pipefail
          CANDIDATE_ARTIFACT="$(find artifacts/models -type f -name model_artifact.json -print -quit)"
          test -n "$CANDIDATE_ARTIFACT"
          CANDIDATE_DIR="$(dirname "$CANDIDATE_ARTIFACT")"
          python scripts/evaluate_welfake_candidate.py --candidate-dir "$CANDIDATE_DIR" --welfake data/WELFake_Dataset.csv

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Runtime artifact Python-to-Node parity
        run: npm run test:runtime-model-parity

      - name: Candidate-specific real/fake safety regression
        run: |
          set -euo pipefail
          CANDIDATE_ARTIFACT="$(find artifacts/models -type f -name model_artifact.json -print -quit)"
          test -n "$CANDIDATE_ARTIFACT"
          npx tsx scripts/runtimeCandidateSafetyTests.ts "$CANDIDATE_ARTIFACT"

      - name: Existing article model safety regression
        run: npm run test:model-safety

      - name: Existing verdict regression
        run: npm run test:verdicts

      - name: Verify canonical production artifact was not modified
        run: cmp /tmp/truthlens-production-artifact.before.json data/saved_model_artifacts.json

      - name: Enforce full-article external release gate; report LIAR separately
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, hashlib, json, os, sys
          paths = sorted(glob.glob("artifacts/models/*/article_ood_validation.json"))
          if not paths:
              print("BLOCKED: task-matched full-article external validation is missing.")
              sys.exit(1)
          report_path = paths[-1]
          with open(report_path, encoding="utf-8") as f:
              report = json.load(f)
          candidate_dir = os.path.dirname(report_path)
          artifact_path = os.path.join(candidate_dir, "model_artifact.json")
          manifest_path = os.path.join(candidate_dir, "manifest.json")
          with open(artifact_path, "rb") as f:
              artifact_sha = hashlib.sha256(f.read()).hexdigest()
          with open(manifest_path, encoding="utf-8") as f:
              manifest = json.load(f)
          with open(os.path.join(candidate_dir, "external_validation.json"), encoding="utf-8") as f:
              liar = json.load(f)
          metrics = report.get("metrics", {})
          checks = {
              "report_completed": report.get("status") == "COMPLETED",
              "artifact_hash_matches": report.get("candidate_artifact_sha256") == artifact_sha == manifest.get("artifact_sha256"),
              "dataset_checksum_matches": report.get("dataset_md5") == "73c9675a4b3d09f86a6933d0b8d7d908",
              "sample_count": report.get("eligible_samples", 0) >= 10000,
              "balanced_accuracy": metrics.get("balanced_accuracy", 0) >= 0.70,
              "fake_recall": metrics.get("fake_recall", 0) >= 0.70,
              "real_recall": metrics.get("real_recall", 0) >= 0.70,
              "manifest_marks_candidate_eligible": manifest.get("production_eligible") is True,
              "report_release_gate": report.get("release_gate", {}).get("passed") is True,
          }
          print(json.dumps({
              "article_external_report": report_path,
              "eligible_samples": report.get("eligible_samples"),
              "metrics": metrics,
              "checks": checks,
              "LIAR_DIAGNOSTIC_ONLY": {
                  "eligible_binary_samples": liar.get("eligible_binary_samples"),
                  "accuracy": liar.get("metrics", {}).get("accuracy"),
                  "balanced_accuracy": liar.get("metrics", {}).get("balanced_accuracy"),
                  "macro_f1": liar.get("metrics", {}).get("macro_f1")
              }
          }, indent=2))
          summary = [
              "## Candidate production eligibility — separate task metrics",
              "",
              "### Full-article external benchmark (primary gate)",
              f"- Dataset: {report.get('dataset')}",
              f"- Eligible non-overlap articles: {report.get('eligible_samples')}",
              f"- Balanced accuracy: {metrics.get('balanced_accuracy')}",
              f"- Fake recall: {metrics.get('fake_recall')}",
              f"- Real recall: {metrics.get('real_recall')}",
              f"- Macro F1: {metrics.get('macro_f1')}",
              "",
              "### LIAR claim benchmark (different task; diagnostic, not article-model gate)",
              f"- Eligible binary claims: {liar.get('eligible_binary_samples')}",
              f"- Accuracy: {liar.get('metrics', {}).get('accuracy')}",
              f"- Balanced accuracy: {liar.get('metrics', {}).get('balanced_accuracy')}",
              "",
              "### Release gate checks"
          ]
          summary += [f"- {'PASS' if ok else 'BLOCKED'}: {name}" for name, ok in checks.items()]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\\n".join(summary) + "\\n")
          if not all(checks.values()):
              print("BLOCKED: do not promote this candidate. Full-article external release gate did not pass.")
              sys.exit(1)
          PY

      - name: Upload runtime candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-runtime-model-candidate
          path: |
            artifacts/models/**
            data/isot_prepared/stats.json
          if-no-files-found: warn
