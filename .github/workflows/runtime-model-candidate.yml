name: Runtime Model Candidate Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/train_isot_runtime_candidate.py"
      - "scripts/runtimeModelParityTests.ts"
      - "scripts/runtimeCandidateSafetyTests.ts"
      - "scripts/evaluate_welfake_candidate.py"
      - "scripts/test_evaluate_welfake_candidate.py"
      - "scripts/isot_data_pipeline.py"
      - "server/mlEngine.ts"
      - "package.json"
      - "requirements-model.txt"
      - ".github/workflows/runtime-model-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truthlens-runtime-model-candidate
  cancel-in-progress: true

jobs:
  polyglot_dataset_probe:
    name: Probe official independent dataset access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query official public metadata and page
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error
          targets = [
              ("dataset_page", "https://data.mendeley.com/datasets/8yfrm6z9dx/1"),
              ("public_files_api", "https://api.data.mendeley.com/datasets/publics/8yfrm6z9dx/files?version=1"),
              ("zip_metadata_api", "https://api.data.mendeley.com/datasets/8yfrm6z9dx/zip?version=1"),
          ]
          def fetch(label, url):
              request = urllib.request.Request(url, headers={"User-Agent":"TruthLens-Research-Validation/1.0"})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      data = response.read()
                      print(json.dumps({"label":label,"status":response.status,"final_url":response.geturl(),
                        "content_type":response.headers.get("content-type"),"bytes":len(data)}))
                      return data
              except urllib.error.HTTPError as error:
                  data = error.read(2048)
                  print(json.dumps({"label":label,"status":error.code,"url":url,
                    "content_type":error.headers.get("content-type"),
                    "body_start":data[:240].decode("utf-8","replace")}))
              except Exception as error:
                  print(json.dumps({"label":label,"error":type(error).__name__+":"+str(error)[:180]}))
              return b""
          html=fetch("dataset_page", targets[0][1]).decode("utf-8","replace")
          from urllib.parse import urljoin, urlparse
          scripts=[urljoin(targets[0][1],src) for src in re.findall(r'<script[^>]+src="([^"]+)"',html,re.IGNORECASE)]
          print(json.dumps({"script_count":len(scripts),"scripts":scripts[:20]}))
          patterns=[
              "api.data.mendeley.com", "datasets/publics", "public-files/datasets",
              "file_downloaded", "download-all", "filesLoading", "zip/file_downloaded",
              "content_details", "download_url", "getFiles", "listFiles", "api/v", "files/list"
          ]
          for script_url in scripts[:15]:
              host=urlparse(script_url).netloc.lower()
              if not any(name in host for name in ("mendeley.com","elsevier.com")):
                  continue
              script=fetch("script_asset",script_url).decode("utf-8","replace")
              findings=[]
              for pattern in patterns:
                  positions=[m.start() for m in re.finditer(re.escape(pattern),script,re.IGNORECASE)]
                  if positions:
                      findings.append({"pattern":pattern,"count":len(positions),
                        "contexts":[script[max(0,i-180):min(len(script),i+350)] for i in positions[:2]]})
              if findings:
                  print(json.dumps({"script_url":script_url,"bytes":len(script),"findings":findings}))
          for filename in ("Fake.xlsx","Real.xlsx","20.xlsx","80.xlsx"):
              index=html.find(filename)
              print(json.dumps({"file_marker":filename,"present":index>=0,
                "context":html[max(0,index-400):index+600] if index>=0 else None}))
          uuids=sorted(set(re.findall(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",html)))
          print(json.dumps({"uuid_count":len(uuids),"uuid_samples":uuids[:15]}))
          for label,url in targets[1:]:
              fetch(label,url)
          PY

  candidate:
    name: Build and validate exact runtime candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"

      - name: Install pinned Python ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-model.txt

      - name: Download and verify official ISOT release assets
        env:
          FAKE_URL: https://github.com/Pappu246/truthlens-ai-fake-news-detection-system/releases/download/isot-data-v1/Fake.csv
          REAL_URL: https://github.com/Pappu246/truthlens-ai-fake-news-detection-system/releases/download/isot-data-v1/True.csv
          FAKE_SHA256: bebf8bcfe95678bf2c732bf413a2ce5f621af0102c82bf08083b2e5d3c693d0c
          REAL_SHA256: ba0844414a65dc6ae7402b8eee5306da24b6b56488d6767135af466c7dcb2775
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$FAKE_URL" -o data/Fake.csv
          curl --fail --location --retry 3 --retry-delay 2 "$REAL_URL" -o data/True.csv
          echo "$FAKE_SHA256  data/Fake.csv" | sha256sum --check -
          echo "$REAL_SHA256  data/True.csv" | sha256sum --check -

      - name: Install model-governance test runner
        run: python -m pip install pytest

      - name: Verify model promotion governance and attribution-ablation contracts
        run: python -m pytest backend/tests/test_phase9_model_governance.py scripts/test_evaluate_welfake_candidate.py -q

      - name: Rebuild verified Phase 2 splits
        run: python scripts/isot_data_pipeline.py

      - name: Download and verify WELFake full-article external evaluation corpus
        timeout-minutes: 8
        env:
          WELFAKE_URL: https://zenodo.org/records/4561253/files/WELFake_Dataset.csv?download=1
          WELFAKE_MD5: 73c9675a4b3d09f86a6933d0b8d7d908
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --show-error --connect-timeout 20 --max-time 360 --retry 2 --retry-all-errors --retry-delay 2 "$WELFAKE_URL" -o data/WELFake_Dataset.csv
          test -s data/WELFake_Dataset.csv
          ls -lh data/WELFake_Dataset.csv
          printf "%s  %s\\n" "$WELFAKE_MD5" "data/WELFake_Dataset.csv" | md5sum --check -

      - name: Snapshot canonical production artifact before candidate training
        run: cp data/saved_model_artifacts.json /tmp/truthlens-production-artifact.before.json

      - name: Train exact compact runtime candidate
        run: python scripts/train_isot_runtime_candidate.py --welfake data/WELFake_Dataset.csv

      - name: Evaluate candidate on untouched WELFake held-out full-article partition
        run: |
          set -euo pipefail
          CANDIDATE_ARTIFACT="$(find artifacts/models -type f -name model_artifact.json -print -quit)"
          test -n "$CANDIDATE_ARTIFACT"
          CANDIDATE_DIR="$(dirname "$CANDIDATE_ARTIFACT")"
          python scripts/evaluate_welfake_candidate.py --candidate-dir "$CANDIDATE_DIR" --welfake data/WELFake_Dataset.csv

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Runtime artifact Python-to-Node parity
        run: npm run test:runtime-model-parity

      - name: Candidate-specific real/fake safety regression
        # Preserve diagnostics and run the artifact-integrity + final gate steps
        # even when candidate safety assertions fail. The final gate will still
        # fail closed because runtime_safety_validation.json records passed=false.
        continue-on-error: true
        run: |
          set -euo pipefail
          CANDIDATE_ARTIFACT="$(find artifacts/models -type f -name model_artifact.json -print -quit)"
          test -n "$CANDIDATE_ARTIFACT"
          npx tsx scripts/runtimeCandidateSafetyTests.ts "$CANDIDATE_ARTIFACT"

      - name: Existing article model safety regression
        run: npm run test:model-safety

      - name: Existing verdict regression
        run: npm run test:verdicts

      - name: Verify canonical production artifact was not modified
        run: cmp /tmp/truthlens-production-artifact.before.json data/saved_model_artifacts.json

      - name: Enforce held-out full-article quality gate; report LIAR separately
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, hashlib, json, os, sys
          paths = sorted(glob.glob("artifacts/models/*/article_heldout_validation.json"))
          if not paths:
              print("BLOCKED: task-matched full-article external validation is missing.")
              sys.exit(1)
          report_path = paths[-1]
          with open(report_path, encoding="utf-8") as f:
              report = json.load(f)
          candidate_dir = os.path.dirname(report_path)
          artifact_path = os.path.join(candidate_dir, "model_artifact.json")
          manifest_path = os.path.join(candidate_dir, "manifest.json")
          with open(artifact_path, "rb") as f:
              artifact_sha = hashlib.sha256(f.read()).hexdigest()
          with open(manifest_path, encoding="utf-8") as f:
              manifest = json.load(f)
          with open(os.path.join(candidate_dir, "external_validation.json"), encoding="utf-8") as f:
              liar = json.load(f)
          safety_path = os.path.join(candidate_dir, "runtime_safety_validation.json")
          if not os.path.isfile(safety_path):
              print("BLOCKED: artifact-bound runtime safety report is missing.")
              sys.exit(1)
          with open(safety_path, encoding="utf-8") as f:
              safety = json.load(f)
          metrics = report.get("metrics", {})
          runtime_policy = report.get("runtime_decision_policy", {})
          runtime_metrics = runtime_policy.get("metrics", {})
          ablation = report.get("source_attribution_ablation", {})
          ablation_metrics = ablation.get("metrics", {})
          ablation_runtime = ablation.get("runtime_decision_policy", {})
          ablation_runtime_metrics = ablation_runtime.get("metrics", {})
          checks = {
              "report_completed": report.get("status") == "COMPLETED",
              "artifact_hash_matches": report.get("candidate_artifact_sha256") == artifact_sha == manifest.get("artifact_sha256"),
              "dataset_checksum_matches": report.get("dataset_md5") == "73c9675a4b3d09f86a6933d0b8d7d908",
              "sample_count": report.get("eligible_samples", 0) >= 10000,
              "runtime_policy_thresholds_match_production": report.get("runtime_policy_contract") == {
                  "fake_threshold": 0.98,
                  "real_threshold": 0.35,
                  "low_vocabulary_coverage_threshold": 0.10,
                  "ood_short_word_count": 100,
                  "ood_coverage_threshold": 0.35,
                  "source": "server/mlEngine.ts production OOD/decision guard",
                  "matches_candidate_artifact": True,
              },
              "candidate_only_safety_policy_is_explicit_and_artifact_bound": (
                  report.get("candidate_safety_policy_contract") == manifest.get("training_contract", {}).get("candidate_safety_policy") == {
                      "id": "sensational-conflict-abstention-v1",
                      "action": "abstain_and_withhold_probabilities",
                      "applies_only_when_model_probability_leans_real": True,
                      "minimum_sensational_terms": 3,
                      "minimum_sensational_terms_with_certainty": 2,
                      "minimum_certainty_terms": 1,
                      "production_status": "RESEARCH_ONLY_NOT_DEPLOYED",
                  } and artifact.get("training_contract", {}).get("candidate_safety_policy") == manifest.get("training_contract", {}).get("candidate_safety_policy")
              ),
              "runtime_safety_report_matches_candidate_artifact": safety.get("status") == "COMPLETED" and safety.get("passed") is True and safety.get("candidate_artifact_sha256") == artifact_sha and safety.get("assertions_failed") == 0,
              "candidate_remains_non_promotable_without_independent_article_validation": manifest.get("production_eligible") is False and manifest.get("promotion_status") == "CANDIDATE_ONLY",
              "holdout_scope_is_not_mislabeled_external": report.get("partition_scope", {}).get("is_source_independent_external_test") is False,
              "holdout_never_used_for_fit_calibration_or_selection": report.get("partition_scope", {}).get("holdout_is_never_fit_calibrated_or_selected") is True,
              "holdout_hashes_disjoint_from_train": report.get("partition_scope", {}).get("holdout_overlaps_train") is False,
              "holdout_hashes_disjoint_from_validation": report.get("partition_scope", {}).get("holdout_overlaps_validation") is False,
              "balanced_accuracy": metrics.get("balanced_accuracy", 0) >= 0.70,
              "fake_recall": metrics.get("fake_recall", 0) >= 0.70,
              "real_recall": metrics.get("real_recall", 0) >= 0.70,
              "runtime_policy_gate_passed": runtime_policy.get("passed") is True,
              "runtime_policy_coverage": runtime_metrics.get("coverage", 0) >= 0.50,
              "runtime_policy_operational_balanced_accuracy": runtime_metrics.get("operational_balanced_accuracy_abstentions_count_as_not_correct", 0) >= 0.70,
              "runtime_policy_fake_recall": runtime_metrics.get("fake_recall_all_fake_samples", 0) >= 0.70,
              "runtime_policy_real_recall": runtime_metrics.get("real_recall_all_real_samples", 0) >= 0.70,
              "byline_ablation_passed": ablation.get("passed") is True,
              "byline_ablation_balanced_accuracy": ablation_metrics.get("balanced_accuracy", 0) >= 0.65,
              "byline_ablation_fake_recall": ablation_metrics.get("fake_recall", 0) >= 0.65,
              "byline_ablation_real_recall": ablation_metrics.get("real_recall", 0) >= 0.65,
              "byline_runtime_policy_gate_passed": ablation_runtime.get("passed") is True,
              "byline_runtime_policy_coverage": ablation_runtime_metrics.get("coverage", 0) >= 0.50,
              "byline_runtime_policy_operational_balanced_accuracy": ablation_runtime_metrics.get("operational_balanced_accuracy_abstentions_count_as_not_correct", 0) >= 0.65,
              "byline_runtime_policy_fake_recall": ablation_runtime_metrics.get("fake_recall_all_fake_samples", 0) >= 0.65,
              "byline_runtime_policy_real_recall": ablation_runtime_metrics.get("real_recall_all_real_samples", 0) >= 0.65,
              "manifest_marks_candidate_only": manifest.get("production_eligible") is False and manifest.get("promotion_status") == "CANDIDATE_ONLY",
              "report_release_gate": report.get("release_gate", {}).get("passed") is True,
          }
          print(json.dumps({
              "article_heldout_report": report_path,
              "eligible_samples": report.get("eligible_samples"),
              "metrics_at_0_50_diagnostic": metrics,
              "runtime_decision_policy": runtime_policy,
              "score_orientation_diagnostic_only": report.get("score_orientation_diagnostic_only"),
              "source_attribution_ablation": {
                  "metrics_at_0_50_diagnostic": ablation_metrics,
                  "runtime_decision_policy": ablation_runtime,
                  "passed": ablation.get("passed")
              },
              "checks": checks,
              "LIAR_DIAGNOSTIC_ONLY": {
                  "eligible_binary_samples": liar.get("eligible_binary_samples"),
                  "accuracy": liar.get("metrics", {}).get("accuracy"),
                  "balanced_accuracy": liar.get("metrics", {}).get("balanced_accuracy"),
                  "macro_f1": liar.get("metrics", {}).get("macro_f1")
              }
          }, indent=2))
          summary = [
              "## Research candidate quality gate — not production promotion",
              "",
              "### Held-out full-article benchmark (same WELFake corpus; not source-independent)",
              f"- Dataset: {report.get('dataset')}",
              f"- Eligible untouched holdout articles: {report.get('eligible_samples')}",
              "- Scope: WELFake train/validation partitions are used for fitting/calibration; the held-out partition is not source-independent external validation.",
              f"- Balanced accuracy: {metrics.get('balanced_accuracy')}",
              f"- Fake recall: {metrics.get('fake_recall')}",
              f"- Real recall: {metrics.get('real_recall')}",
              f"- Macro F1 at p_fake=0.50 diagnostic threshold: {metrics.get('macro_f1')}",
              f"- Runtime-policy coverage: {runtime_metrics.get('coverage')}",
              f"- Runtime-policy balanced accuracy (abstentions count as not correct): {runtime_metrics.get('operational_balanced_accuracy_abstentions_count_as_not_correct')}",
              f"- Runtime-policy fake recall: {runtime_metrics.get('fake_recall_all_fake_samples')}",
              f"- Runtime-policy real recall: {runtime_metrics.get('real_recall_all_real_samples')}",
              "",
              "### Publisher-byline ablation stress test",
              f"- Balanced accuracy: {ablation_metrics.get('balanced_accuracy')}",
              f"- Fake recall: {ablation_metrics.get('fake_recall')}",
              f"- Real recall at p_fake=0.50: {ablation_metrics.get('real_recall')}",
              f"- Byline runtime-policy coverage: {ablation_runtime_metrics.get('coverage')}",
              f"- Byline runtime-policy balanced accuracy: {ablation_runtime_metrics.get('operational_balanced_accuracy_abstentions_count_as_not_correct')}",
              f"- Byline runtime-policy fake recall: {ablation_runtime_metrics.get('fake_recall_all_fake_samples')}",
              f"- Byline runtime-policy real recall: {ablation_runtime_metrics.get('real_recall_all_real_samples')}",
              "",
              "### LIAR claim benchmark (different task; diagnostic, not article-model gate)",
              f"- Eligible binary claims: {liar.get('eligible_binary_samples')}",
              f"- Accuracy: {liar.get('metrics', {}).get('accuracy')}",
              f"- Balanced accuracy: {liar.get('metrics', {}).get('balanced_accuracy')}",
              "",
              "### Release gate checks"
          ]
          summary += [f"- {'PASS' if ok else 'BLOCKED'}: {name}" for name, ok in checks.items()]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")
          if not all(checks.values()):
              print("BLOCKED: do not promote this candidate. Held-out full-article quality gate did not pass.")
              sys.exit(1)
          PY

      - name: Upload runtime candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-runtime-model-candidate
          path: |
            artifacts/models/**
            data/isot_prepared/stats.json
          if-no-files-found: warn
