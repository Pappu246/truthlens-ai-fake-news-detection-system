name: Runtime Model Candidate Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/train_isot_runtime_candidate.py"
      - "scripts/runtimeModelParityTests.ts"
      - "scripts/runtimeCandidateSafetyTests.ts"
      - "scripts/isot_data_pipeline.py"
      - "server/mlEngine.ts"
      - "package.json"
      - "requirements-model.txt"
      - ".github/workflows/runtime-model-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build and validate exact runtime candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"

      - name: Install pinned Python ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-model.txt

      - name: Download and verify official ISOT release assets
        env:
          FAKE_URL: https://github.com/Pappu246/truthlens-ai-fake-news-detection-system/releases/download/isot-data-v1/Fake.csv
          REAL_URL: https://github.com/Pappu246/truthlens-ai-fake-news-detection-system/releases/download/isot-data-v1/True.csv
          FAKE_SHA256: bebf8bcfe95678bf2c732bf413a2ce5f621af0102c82bf08083b2e5d3c693d0c
          REAL_SHA256: ba0844414a65dc6ae7402b8eee5306da24b6b56488d6767135af466c7dcb2775
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$FAKE_URL" -o data/Fake.csv
          curl --fail --location --retry 3 --retry-delay 2 "$REAL_URL" -o data/True.csv
          echo "$FAKE_SHA256  data/Fake.csv" | sha256sum --check -
          echo "$REAL_SHA256  data/True.csv" | sha256sum --check -

      - name: Rebuild verified Phase 2 splits
        run: python scripts/isot_data_pipeline.py

      - name: Snapshot canonical production artifact before candidate training
        run: cp data/saved_model_artifacts.json /tmp/truthlens-production-artifact.before.json

      - name: Train exact compact runtime candidate
        run: python scripts/train_isot_runtime_candidate.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Runtime artifact Python-to-Node parity
        run: npm run test:runtime-model-parity

      - name: Candidate-specific real/fake safety regression
        run: |
          set -euo pipefail
          CANDIDATE_ARTIFACT="$(find artifacts/models -type f -name model_artifact.json -print -quit)"
          test -n "$CANDIDATE_ARTIFACT"
          npx tsx scripts/runtimeCandidateSafetyTests.ts "$CANDIDATE_ARTIFACT"

      - name: Existing article model safety regression
        run: npm run test:model-safety

      - name: Existing verdict regression
        run: npm run test:verdicts

      - name: Verify canonical production artifact was not modified
        run: cmp /tmp/truthlens-production-artifact.before.json data/saved_model_artifacts.json

      - name: Enforce production model out-of-domain release gate
        run: |
          python - <<'PY'
          import glob, json, sys
          paths = glob.glob("artifacts/models/*/external_validation.json")
          if not paths:
              print("BLOCKED: candidate external-validation report is missing.")
              sys.exit(1)
          path = sorted(paths)[-1]
          report = json.load(open(path, encoding="utf-8"))
          metrics = report.get("metrics", {})
          balanced = metrics.get("balanced_accuracy")
          print(json.dumps({
              "report": path,
              "eligible_binary_samples": report.get("eligible_binary_samples"),
              "balanced_accuracy": balanced,
              "accuracy": metrics.get("accuracy"),
              "macro_f1": metrics.get("macro_f1")
          }, indent=2))
          summary = (
              "## Candidate production eligibility\n\n"
              f"- LIAR eligible binary samples: {report.get('eligible_binary_samples')}\n"
              f"- LIAR balanced accuracy: {balanced}\n"
              "- Required by scripts/promote_model.py: balanced accuracy > 0.50\n"
          )
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)
          if report.get("status") != "COMPLETED" or not isinstance(balanced, (int, float)) or balanced <= 0.50:
              print("BLOCKED: do not promote this candidate; the existing out-of-domain release gate did not pass.")
              sys.exit(1)
          PY

      - name: Upload runtime candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-runtime-model-candidate
          path: |
            artifacts/models/**
            data/isot_prepared/stats.json
          if-no-files-found: warn
