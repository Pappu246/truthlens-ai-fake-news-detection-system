# Research gate rerun: corrected workflow schema
name: V2 SciFact End-to-End Benchmark

on:
  push:
    branches:
      - main
    paths:
      - 'server/v2/**'
      - 'scripts/v2ScifactEndToEnd.ts'
      - 'scripts/v2ScifactPassageGranularity.ts'
      - 'scripts/v2DownloadModels.ts'
      - 'data/v2/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v2-*.yml'
  pull_request:
    branches:
      - main
    # Run the expensive full SciFact pass only when evaluation inputs/runtime
    # change. Do not launch it for unrelated model-quality workflow edits or
    # package.json script registrations; CI still type-checks those changes.
    paths:
      - 'server/v2/**'
      - 'scripts/v2ScifactEndToEnd.ts'
      - 'scripts/v2ScifactPassageGranularity.ts'
      - 'scripts/v2DownloadModels.ts'
      - 'data/v2/**'
      - 'package-lock.json'
      - '.github/workflows/v2-scifact-end-to-end.yml'
  workflow_dispatch:

concurrency:
  group: truthlens-v2-scifact-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRUTHLENS_EVALUATED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scifact-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Download exact frozen SciFact dev data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/truthlens-scifact
          mkdir -p /tmp/truthlens-scifact/scifact
          BASE="https://raw.githubusercontent.com/vidi-deshp12/scifact-claim-verification/051b5245aa9d4b98c1302920cc5e4958b9e30ef9/data"
          curl --fail --retry 4 --retry-all-errors -L "$BASE/claims_dev.jsonl" -o /tmp/truthlens-scifact/scifact/claims_dev.jsonl
          curl --fail --retry 4 --retry-all-errors -L "$BASE/corpus.jsonl" -o /tmp/truthlens-scifact/scifact/corpus.jsonl

      - name: Verify exact dataset hashes and counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          expected = {
              "/tmp/truthlens-scifact/scifact/claims_dev.jsonl": "86f0435d08fdb65d1aa41d1472684f57e6e71930626497bdf4d7a9ec1a632217",
              "/tmp/truthlens-scifact/scifact/corpus.jsonl": "b8d6c89624cb2ed74dee8938effc4f5d8bd2086887880af8110d64be4ceade62",
          }
          for path, want in expected.items():
              got = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert got == want, (path, got, want)

          claims = [json.loads(x) for x in Path("/tmp/truthlens-scifact/scifact/claims_dev.jsonl").read_text().splitlines() if x.strip()]
          corpus = [json.loads(x) for x in Path("/tmp/truthlens-scifact/scifact/corpus.jsonl").read_text().splitlines() if x.strip()]
          assert len(claims) == 300
          assert len(corpus) == 5183
          print("SciFact frozen inputs: PASS")
          PY

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Install local pretrained runtime
        run: npm install --no-save @huggingface/transformers@3.7.6 onnxruntime-node@1.21.0

      - name: Download and verify sealed research models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run download:v2-models

      - name: Run end-to-end SciFact benchmark
        env:
          TRUTHLENS_V2_ML_CALL_TIMEOUT_MS: 180000
          TRUTHLENS_V2_RESEARCH_TRACE: 'true'
          TRUTHLENS_V2_REQUIRE_RESEARCH_TRACE: 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/v2-scifact-e2e
          npm run eval:v2-scifact-e2e -- \
            --data-dir=/tmp/truthlens-scifact/scifact \
            --max-claims=300 \
            --candidate-k=100 \
            --dense-k=300 \
            --final-k=8 \
            --research-trace=true \
            --output=artifacts/v2-scifact-e2e/scifact-end-to-end.json \
            2>&1 | tee artifacts/v2-scifact-e2e/scifact-end-to-end.log

      - name: Run paired SciFact passage-granularity diagnostic
        env:
          TRUTHLENS_V2_ML_CALL_TIMEOUT_MS: 180000
        run: |
          set -euo pipefail
          npm run eval:v2-scifact-passage-granularity -- \
            --data-dir=/tmp/truthlens-scifact/scifact \
            --max-claims=300 \
            --output=artifacts/v2-scifact-e2e/scifact-passage-granularity.json \
            2>&1 | tee artifacts/v2-scifact-e2e/scifact-passage-granularity.log

      - name: Validate benchmark provenance and metric denominators
        env:
          EXPECTED_COMMIT_SHA: ${{ env.TRUTHLENS_EVALUATED_COMMIT_SHA }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          path = Path("artifacts/v2-scifact-e2e/scifact-end-to-end.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report.get("benchmark") is True
          provenance = report["run_provenance"]
          assert provenance["source_commit_sha"] == os.environ["EXPECTED_COMMIT_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", provenance["source_commit_sha"])
          assert re.fullmatch(r"[0-9a-f]{64}", provenance["config_sha256"])
          assert re.fullmatch(r"[0-9a-f]{64}", provenance["model_manifest_sha256"])
          assert provenance["model_manifest_sha256"] == report["models"]["manifest_sha256"]
          assert hashlib.sha256(json.dumps(report["config"], separators=(",", ":")).encode()).hexdigest() == provenance["config_sha256"]
          assert hashlib.sha256(json.dumps(report["models"]["sealed_manifest"], separators=(",", ":")).encode()).hexdigest() == provenance["model_manifest_sha256"]
          model_manifest = report["models"]["sealed_manifest"]
          for model_key, model_kind in (("nli", "nli"), ("embedding", "embedding")):
              model_record = next(item for item in model_manifest if item["kind"] == model_kind)
              expected_weight = next(item["sha256"] for item in model_record["files"] if item["path"] == "onnx/model_quantized.onnx")
              assert report["models"][model_key]["artifact_sha256"] == expected_weight

          rows = report["rows"]
          # A successful benchmark is not sufficient unless the opt-in NLI
          # diagnostics were actually enabled and persisted in the artifact.
          assert report["config"].get("research_trace_enabled") is True, "NLI research trace must be enabled for this diagnostic run"
          assert all("evidence_trace" in row for row in rows), "Every claim row must carry an evidence_trace field (possibly empty)"
          trace_entries = [entry for row in rows for entry in row["evidence_trace"]]
          assert trace_entries, "Expected at least one per-evidence NLI trace entry"
          for entry in trace_entries:
              trace = entry.get("research_trace")
              assert isinstance(trace, dict), "Every evidence entry must include research_trace"
              assert isinstance(trace.get("relatedness_cosine"), (int, float))
              assert isinstance(trace.get("relatedness_gate_passed"), bool)
              assert trace.get("selected_hypothesis_pass") in ("passA:claim-as-stated", "passB:content-proposition", "relatedness_gate")
              assert "raw_probabilities" in trace and "pass_a_probabilities" in trace
              if trace["selected_hypothesis_pass"] == "relatedness_gate":
                  assert trace["raw_probabilities"] is None, "Gated passages must not claim cross-encoder probabilities"
              else:
                  probs = trace["raw_probabilities"]
                  assert isinstance(probs, dict) and all(isinstance(probs.get(k), (int, float)) for k in ("entailment", "contradiction", "neutral"))
                  assert all(0 <= probs[k] <= 1 for k in ("entailment", "contradiction", "neutral"))
                  assert abs(sum(probs[k] for k in ("entailment", "contradiction", "neutral")) - 1.0) < 1e-5
              decision = entry.get("research_decision_trace")
              assert isinstance(decision, dict), "Every evidence entry must include decision-weight trace"
              expected_direction = entry["nli_label"] if entry["nli_label"] in ("SUPPORTS", "REFUTES") else "NONE"
              assert decision.get("vote_direction") == expected_direction
              assert decision.get("contributes_to_directional_tally") is (expected_direction != "NONE")
              expected_weight = entry["nli_confidence"] * entry["rerank_score"] * decision["duplicate_penalty"]
              assert abs(decision["vote_weight"] - expected_weight) < 1e-8, "Recorded vote weight must match NLI confidence × rerank score × duplicate penalty"
          assert all(isinstance(row.get("final_decision_rule_trace"), list) for row in rows), "Every claim row must carry final decision-rule trace"
          print("NLI research trace artifact contract: PASS; entries=" + str(len(trace_entries)))
          evidence_claims = sum(bool(row["gold_evidence_ids"]) for row in rows)
          end_to_end = report["end_to_end"]
          assert evidence_claims == end_to_end["open_candidate_recall_denominator"]
          assert evidence_claims == end_to_end["gold_evidence_recall_at_5_denominator"]
          assert end_to_end["open_candidate_recall_hits"] == sum(
              bool(row["gold_evidence_ids"]) and row["candidate_pool_recall_hit"] for row in rows
          )
          assert end_to_end["gold_evidence_recall_at_5_hits"] <= evidence_claims
          assert end_to_end["benchmark_directional_accuracy"] >= 0
          assert end_to_end["benchmark_directional_accuracy"] <= 1
          confusion = end_to_end["benchmark_directional_confusion_matrix"]
          assert sum(sum(row["predicted"].values()) for row in confusion) == len(rows)
          assert report["dataset"]["claims_evaluated"] == 300
          assert report["dataset"]["corpus_documents"] == 5183
          print("SciFact benchmark provenance + metric denominators: PASS")
          print("commit=" + provenance["source_commit_sha"])
          print("candidate_recall=" + str(end_to_end["open_candidate_recall_hits"]) + "/" + str(evidence_claims))
          print("evidence_recall_at_5=" + str(end_to_end["gold_evidence_recall_at_5_hits"]) + "/" + str(evidence_claims))
          PY

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: truthlens-v2-scifact-end-to-end
          path: artifacts/v2-scifact-e2e
          if-no-files-found: error
          retention-days: 30
