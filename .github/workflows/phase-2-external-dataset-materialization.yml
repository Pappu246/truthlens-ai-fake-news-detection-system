name: Phase 2 External Dataset Materialization

on:
  push:
    branches:
      - 'research/phase2-multibenchmark-harness-v2'
  pull_request:
    branches:
      - main
    paths:
      - 'research/multibenchmark-manifest.json'
      - 'scripts/materializePhase2Benchmarks.ts'
      - 'scripts/phase2MaterializationTests.ts'
      - '.github/workflows/phase-2-external-dataset-materialization.yml'

permissions:
  contents: read

jobs:
  materialize:
    name: Materialize official benchmark assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download official benchmark assets
        run: npm run materialize:phase2
      - name: Verify materialization manifest
        run: test -s artifacts/phase2/raw/materialization-manifest.json
      - name: Upload materialization manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthlens-phase2-materialization
          path: artifacts/phase2/raw/materialization-manifest.json
          if-no-files-found: error
