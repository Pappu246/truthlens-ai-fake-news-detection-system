name: TruthLens Autonomous Research Squad

on:
  workflow_dispatch:
  schedule:
    - cron: "45 4 * * 0"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: truthlens-autonomous-squad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    name: Generate autonomous research checkpoint and agent report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JSON contracts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('research/autonomous-squad-config.json', 'utf8')); console.log('Squad config: OK')"
          node -e "JSON.parse(require('fs').readFileSync('research/multibenchmark-manifest.json', 'utf8')); console.log('Benchmark manifest: OK')"
          node --check scripts/autonomousSquad.mjs
          node --check scripts/autonomousSquadTests.mjs
          node --check scripts/autonomousSquadAgents.mjs
          node --check scripts/autonomousBenchmarkPlanner.mjs

      - name: Run governance invariants
        run: node scripts/autonomousSquadTests.mjs

      - name: Refresh research intelligence
        run: node scripts/researchIntelligence.mjs
        continue-on-error: true
        env:
          RESEARCH_INTELLIGENCE_OUT: autonomous-squad-output/research-intelligence

      - name: Generate deterministic checkpoint
        run: node scripts/autonomousSquad.mjs

      - name: Execute squad role checks
        run: node scripts/autonomousSquadAgents.mjs

      - name: Plan benchmark runner states
        run: node scripts/autonomousBenchmarkPlanner.mjs

      - name: Upload resumable checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truthlens-autonomous-squad-checkpoint-${{ github.run_number }}
          path: autonomous-squad-output/
          if-no-files-found: error
          retention-days: 90
